<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;src:url('fonts/fredoka.woff2') format('woff2');font-weight:600}
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block;width:1920px;height:1080px}
text{font-family:Fredoka,'DejaVu Sans',sans-serif;font-weight:600}
</style></head><body>
<svg id="s" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="data.js"></script>
<script>
const D=window.EP,V=D.V,C=D.C,PI=Math.PI;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>{u=cl(u);return u*u*(3-2*u)};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const es=(t,a,b)=>ease(seg(t,a,b));
const pulse=(t,a,b,r=.25)=>es(t,a,a+r)*(1-es(t,b-r,b));
const talk1=(id,t)=>{const l=V[id];if(t<l.s||t>=l.e)return 0;const i=(t-l.s)*D.fps,a=l.env[Math.floor(i)]||0,b=l.env[Math.floor(i)+1]||0;return lerp(a,b,i%1)};
const blink=(t,ph)=>((t+ph)%3.7)<.12?.1:1;
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,u)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],u)).toString(16).padStart(2,'0')).join('')};
const n=v=>(+v).toFixed(1);

const HEAD='#2d2a55',OUT='#1b1936',TEAL='#1fb5a8',CORAL='#ff6b5e',SUN='#ffd166',NIGHT='#07061c';
const FLOOR=905;

const DEFS=`<defs>
<radialGradient id="hg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#4a4685"/><stop offset=".6" stop-color="${HEAD}"/><stop offset="1" stop-color="#211f42"/></radialGradient>
<radialGradient id="hg2" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#9a4f8c"/><stop offset=".6" stop-color="#6a2d5f"/><stop offset="1" stop-color="#4a1d43"/></radialGradient><radialGradient id="hg3" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7d5a92"/><stop offset=".6" stop-color="#5b3a6e"/><stop offset="1" stop-color="#3f2650"/></radialGradient><clipPath id="mc"><rect x="1010" y="150" width="620" height="770" rx="26"/></clipPath>
<clipPath id="mc2"><rect x="290" y="150" width="620" height="770" rx="26"/></clipPath>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eefbff"/><stop offset="1" stop-color="#cfeef5"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#05040f" stop-opacity="0"/><stop offset="1" stop-color="#05040f" stop-opacity=".62"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff7c2" stop-opacity=".9"/><stop offset="1" stop-color="#fff7c2" stop-opacity="0"/></radialGradient>
<radialGradient id="spill"><stop offset="0" stop-color="#dff6ff" stop-opacity=".5"/><stop offset="1" stop-color="#dff6ff" stop-opacity="0"/></radialGradient>
</defs>`;

function star(x,y,r,rot,fill,op=1){let p='';for(let i=0;i<8;i++){const a=i*PI/4+rot,R=i%2?r*.42:r;p+=(i?'L':'M')+n(x+Math.cos(a)*R)+' '+n(y+Math.sin(a)*R)}return `<path d="${p}Z" fill="${fill}" opacity="${n(op)}"/>`}

function char(q){
  const o=Object.assign({x:0,y:FLOOR,s:1,face:1,sw:TEAL,sc:CORAL,aL:8,aR:8,mouth:0,smile:.6,open:1,look:[0,0],brow:0,tilt:0,head:0,bob:0,sqy:1,walk:null,rot:0,brush:0,brushL:0,back:0,hg:'hg',hc:HEAD,flip:0,bun:0,bow:0},q);
  const f=o.face,sf=o.flip?-f:f,fx=f*36,m=cl(o.mouth),op=cl(o.open,.05,1.15);
  const lp=o.walk==null?0:Math.sin(o.walk)*24;
  const leg=(x,a)=>`<g transform="translate(${x},-95) rotate(${n(a)})"><rect x="-16" y="0" width="32" height="88" rx="15" fill="#3a3768" stroke="${OUT}" stroke-width="5"/><ellipse cx="${n(f*9)}" cy="90" rx="28" ry="14" fill="${SUN}" stroke="${OUT}" stroke-width="5"/></g>`;
  const arm=(side,a,held)=>{const r=a*PI/180,sx=side*64,sy=-228,ex=sx+side*Math.sin(r)*118,ey=sy+Math.cos(r)*118;
    return (held?`<g transform="translate(${n(ex)},${n(ey)}) rotate(-20)"><rect x="-7" y="-92" width="14" height="110" rx="7" fill="${TEAL}" stroke="${OUT}" stroke-width="4"/><rect x="-11" y="-112" width="22" height="30" rx="6" fill="#fff" stroke="${OUT}" stroke-width="4"/></g>`:'')+`<line x1="${sx}" y1="${sy}" x2="${n(ex)}" y2="${n(ey)}" stroke="${OUT}" stroke-width="46" stroke-linecap="round"/><line x1="${sx}" y1="${sy}" x2="${n(ex)}" y2="${n(ey)}" stroke="${o.sw}" stroke-width="36" stroke-linecap="round"/><circle cx="${n(ex)}" cy="${n(ey)}" r="25" fill="${o.hc}" stroke="${OUT}" stroke-width="5"/>`};
  let eyes='';
  for(const i of [-1,1]){
    const ex=fx+i*40,far=i*f<0,rx=26*(far?1-.22*Math.abs(f):1),ry=Math.max(3,31*op),pr=Math.min(13,ry-2);
    eyes+=`<ellipse cx="${n(ex)}" cy="-12" rx="${n(rx)}" ry="${n(ry)}" fill="#fff"/>`;
    if(op>.25)eyes+=`<circle cx="${n(ex+o.look[0]*9+f*3)}" cy="${n(-12+o.look[1]*8)}" r="${n(pr)}" fill="#17152e"/><circle cx="${n(ex+o.look[0]*9+f*3-4)}" cy="${n(-17+o.look[1]*8)}" r="4.5" fill="#fff"/>`;
    eyes+=`<line x1="${n(ex-19)}" y1="0" x2="${n(ex+19)}" y2="0" transform="translate(0,${n(-56-o.brow*7)}) rotate(${n(i*o.brow*15)} ${n(ex)} 0)" stroke="#c4bff0" stroke-width="7" stroke-linecap="round"/>`;
    eyes+=`<ellipse cx="${n(ex+i*16)}" cy="22" rx="15" ry="9" fill="#ff8fab" opacity=".5"/>`;
  }
  const mouth=m>.1?`<ellipse cx="${n(fx)}" cy="46" rx="${n(13+9*m)}" ry="${n(3+19*m)}" fill="#5a1030" stroke="#fff" stroke-width="3"/>`+(m>.45?`<ellipse cx="${n(fx)}" cy="${n(46+10*m)}" rx="${n(8+4*m)}" ry="${n(7*m)}" fill="#ff7a9c"/>`:'')
    :`<path d="M ${n(fx-21)} 42 Q ${n(fx)} ${n(42+o.smile*22)} ${n(fx+21)} 42" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`;
  return `<g transform="translate(${n(o.x)},${n(o.y+o.bob)}) translate(0,${n(-230*o.s)}) rotate(${n(o.rot)}) translate(0,${n(230*o.s)}) scale(${o.s},${n(o.s*o.sqy)}) rotate(${n(o.tilt)})">
  <ellipse cx="0" cy="4" rx="95" ry="14" fill="#000" opacity="${o.rot||o.bob<-60?0:.12}"/>
  ${leg(-30,lp)}${leg(30,-lp)}
  <rect x="-74" y="-262" width="148" height="184" rx="62" fill="${o.sw}" stroke="${OUT}" stroke-width="5"/>
  <path d="M -38 -130 Q 0 -104 38 -130" fill="none" stroke="${OUT}" stroke-width="5" stroke-linecap="round" opacity=".35"/>
  ${arm(-1,o.aL,o.brushL)}${arm(1,o.aR,o.brush)}
  <rect x="${n(-sf*46-15)}" y="-262" width="30" height="78" rx="13" fill="${o.sc}" stroke="${OUT}" stroke-width="5" transform="rotate(${n(-sf*8)} ${n(-sf*46)} -262)"/>
  <ellipse cx="0" cy="-258" rx="74" ry="25" fill="${o.sc}" stroke="${OUT}" stroke-width="5"/>
  <g transform="translate(0,-362) rotate(${n(o.head)} 0 100)">
    <ellipse cx="${n(f*12)}" cy="-116" rx="11" ry="26" transform="rotate(${n(f*28)} ${n(f*12)} -116)" fill="${o.hc}" stroke="${OUT}" stroke-width="5"/>
    <ellipse cx="${n(-f*10)}" cy="-112" rx="9" ry="18" transform="rotate(${n(-f*30)} ${n(-f*10)} -112)" fill="${o.hc}" stroke="${OUT}" stroke-width="5"/>
    ${o.bun?`<circle cx="0" cy="-118" r="50" fill="${o.hc}" stroke="${OUT}" stroke-width="5"/>`:''}<circle r="112" fill="url(#${o.hg})" stroke="${OUT}" stroke-width="5"/>${o.bow?`<polygon points="0,-112 -52,-146 -52,-84" fill="${CORAL}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/><polygon points="0,-112 52,-146 52,-84" fill="${CORAL}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/><circle cx="0" cy="-112" r="13" fill="${CORAL}" stroke="${OUT}" stroke-width="5"/>`:''}
    <ellipse cx="-48" cy="-62" rx="26" ry="13" transform="rotate(-35 -48 -62)" fill="#fff" opacity=".3"/>
    ${o.back?'':eyes+mouth}
  </g></g>`;
}

function tiles(x,y,w,h,fill,line,step=86){let g=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;for(let i=x;i<=x+w;i+=step)g+=`<line x1="${i}" y1="${y}" x2="${i}" y2="${y+h}" stroke="${line}" stroke-width="3"/>`;for(let j=y;j<=y+h;j+=step)g+=`<line x1="${x}" y1="${j}" x2="${x+w}" y2="${j}" stroke="${line}" stroke-width="3"/>`;return g}
// wall clock showing 7:14; `mir` draws it as a true reflection (backwards)
function wallClock(x,y,r,t,mir,sc=1){
  const k=r/62;let g=`<g transform="translate(${x},${y}) scale(${n(sc*(mir?-1:1))},${n(sc)})"><circle r="${r}" fill="#fdfdff" stroke="${OUT}" stroke-width="5"/>`;
  [['12',0,-36],['3',40,10],['6',0,50],['9',-40,10]].forEach(([s,a,b])=>g+=`<text x="${a*k}" y="${b*k}" font-size="${24*k}" text-anchor="middle" fill="${HEAD}">${s}</text>`);
  g+=`<line x1="0" y1="0" x2="0" y2="${-26*k}" stroke="${HEAD}" stroke-width="${7*k}" stroke-linecap="round" transform="rotate(217)"/><line x1="0" y1="0" x2="0" y2="${-44*k}" stroke="${HEAD}" stroke-width="${5*k}" stroke-linecap="round" transform="rotate(${n(84+t/10)})"/><line x1="0" y1="0" x2="0" y2="${-48*k}" stroke="${CORAL}" stroke-width="${2.5*k}" stroke-linecap="round" transform="rotate(${Math.floor(t)*6})"/><circle r="${5*k}" fill="${HEAD}"/></g>`;
  return g}
const VANITY=`<g><rect x="90" y="672" width="430" height="233" rx="16" fill="#6c8fe0" stroke="${OUT}" stroke-width="5"/><rect x="118" y="716" width="176" height="160" rx="10" fill="#7fa0ee"/><rect x="316" y="716" width="176" height="160" rx="10" fill="#7fa0ee"/><circle cx="276" cy="796" r="8" fill="#fff"/><circle cx="334" cy="796" r="8" fill="#fff"/>
<rect x="70" y="640" width="470" height="40" rx="12" fill="#fdfdff" stroke="${OUT}" stroke-width="5"/><ellipse cx="260" cy="646" rx="110" ry="14" fill="#dfe6f5"/>
<path d="M 250 640 V 590 Q 250 560 285 560 Q 315 560 315 590" fill="none" stroke="#9aa3b8" stroke-width="16" stroke-linecap="round"/>
<rect x="420" y="582" width="56" height="60" rx="8" fill="#ff9eb5" stroke="${OUT}" stroke-width="5"/><line x1="436" y1="586" x2="428" y2="532" stroke="${TEAL}" stroke-width="9" stroke-linecap="round"/><line x1="458" y1="586" x2="468" y2="528" stroke="${SUN}" stroke-width="9" stroke-linecap="round"/></g>`;
const WINDOW=(night)=>night?`<g><rect x="130" y="110" width="330" height="300" rx="22" fill="#151238" stroke="#8a86b8" stroke-width="18"/><circle cx="380" cy="190" r="42" fill="#fff6c9"/><circle cx="398" cy="178" r="36" fill="#151238"/><line x1="295" y1="110" x2="295" y2="410" stroke="#8a86b8" stroke-width="12"/><line x1="130" y1="260" x2="460" y2="260" stroke="#8a86b8" stroke-width="12"/></g>`
 :`<g><rect x="130" y="110" width="330" height="300" rx="22" fill="#9bdcff" stroke="#fff" stroke-width="18"/><circle cx="380" cy="190" r="42" fill="${SUN}"/><ellipse cx="230" cy="330" rx="70" ry="24" fill="#fff" opacity=".9"/><ellipse cx="290" cy="312" rx="50" ry="22" fill="#fff" opacity=".9"/><line x1="295" y1="110" x2="295" y2="410" stroke="#fff" stroke-width="12"/><line x1="130" y1="260" x2="460" y2="260" stroke="#fff" stroke-width="12"/></g>`;
const BG1=`<rect width="1920" height="1080" fill="#fff0d9"/>
${tiles(0,560,1920,345,'#c5ece3','#a3dccf')}
<rect x="0" y="548" width="1920" height="16" fill="#8fd0c2"/>
<rect x="0" y="${FLOOR}" width="1920" height="175" fill="#cbbdf0"/><rect x="0" y="${FLOOR}" width="1920" height="10" fill="#a996de"/>
${WINDOW(false)}${VANITY}
<g><circle cx="1790" cy="400" r="14" fill="#9aa3b8"/><rect x="1730" y="408" width="120" height="250" rx="10" fill="${SUN}" stroke="${OUT}" stroke-width="5"/><rect x="1730" y="590" width="120" height="16" fill="#fff"/><rect x="1730" y="560" width="120" height="10" fill="#fff"/></g>
<ellipse cx="760" cy="965" rx="330" ry="46" fill="#ff9eb5"/><ellipse cx="760" cy="965" rx="290" ry="34" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="14 14"/>`;
const MIRROR_FRAME=(x)=>`<rect x="${x}" y="150" width="620" height="770" rx="26" fill="none" stroke="#f6c453" stroke-width="26"/><rect x="${x}" y="150" width="620" height="770" rx="26" fill="none" stroke="${OUT}" stroke-width="5"/><rect x="${x-13}" y="137" width="646" height="796" rx="36" fill="none" stroke="${OUT}" stroke-width="5"/>`;
const SHINE=(x)=>`<polygon points="${x+60},150 ${x+190},150 ${x-60},920 ${x-190},920" fill="#fff" opacity=".22"/><polygon points="${x+250},150 ${x+300},150 ${x+50},920 ${x},920" fill="#fff" opacity=".16"/>`;
const CLOCKX=700,CLOCKY=250;

/* ================= Episode 3 ================= */
const ids=(p,k)=>Array.from({length:k},(_,i)=>p+(i+1));
const tk=L=>t=>L.reduce((s,id)=>s+talk1(id,t),0);
const PLUM='#b565c9',MHC='#5b3a6e';
const farMirrors=(t,mf)=>{let g='';for(let i=0;i<14;i++){const x=300+(i*131)%560,y=170+(i*173)%330,w=26+(i*13)%30;g+=`<rect x="${x}" y="${y}" width="${w}" height="${n(w*1.35)}" rx="4" fill="#fff0d9" stroke="#f6c453" stroke-width="3" opacity="${n(mf*(.4+.3*Math.sin(t*1.3+i)**2))}"/>`}return g};
function girl(o){return char(Object.assign({hg:'hg2',hc:'#6a2d5f',sw:SUN,sc:PLUM,bow:1},o))}
function mother(o){return char(Object.assign({hg:'hg3',hc:MHC,sw:PLUM,sc:'#f6c453',bun:1,s:1.2},o))}
function cat(o){
  const c=Object.assign({x:0,y:0,s:1,face:-1,hiss:0,glow:0},o),f=c.face,h=c.hiss,G='#8d8fa3';
  let g=`<g transform="translate(${n(c.x)},${n(c.y)}) scale(${c.s})">`;
  g+=`<path d="M ${-f*40} -18 Q ${-f*(96+h*10)} ${-30-h*70} ${-f*(70-h*40)} ${-110-h*60}" fill="none" stroke="${OUT}" stroke-width="${n(24+h*12)}" stroke-linecap="round"/><path d="M ${-f*40} -18 Q ${-f*(96+h*10)} ${-30-h*70} ${-f*(70-h*40)} ${-110-h*60}" fill="none" stroke="${G}" stroke-width="${n(15+h*12)}" stroke-linecap="round"/>`;
  g+=`<ellipse cx="0" cy="${n(-62-h*14)}" rx="${n(52+h*10)}" ry="${n(62-h*6)}" fill="${G}" stroke="${OUT}" stroke-width="5"/><ellipse cx="${f*6}" cy="${n(-40-h*14)}" rx="26" ry="34" fill="#c9cad8"/>`;
  const hx=f*20,hy=-142-h*8;
  g+=`<polygon points="${hx-36},${hy-18} ${hx-30},${hy-66} ${hx-6},${hy-34}" fill="${G}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/><polygon points="${hx+36},${hy-18} ${hx+30},${hy-66} ${hx+6},${hy-34}" fill="${G}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/><circle cx="${hx}" cy="${hy}" r="42" fill="${G}" stroke="${OUT}" stroke-width="5"/>`;
  for(const i of [-1,1]){g+=(c.glow?`<circle cx="${hx+i*16+f*6}" cy="${hy-4}" r="20" fill="#f6e45a" opacity=".35"/>`:'')+`<ellipse cx="${hx+i*16+f*6}" cy="${hy-4}" rx="11" ry="${n(12-h*3)}" fill="#f6e45a"/><ellipse cx="${hx+i*16+f*8}" cy="${hy-4}" rx="${n(3+h*1)}" ry="10" fill="${OUT}"/>`}
  g+=h>.3?`<ellipse cx="${hx+f*8}" cy="${hy+20}" rx="12" ry="${n(4+h*9)}" fill="#b0304a" stroke="${OUT}" stroke-width="3"/>`:`<path d="M ${hx+f*8-8} ${hy+18} l 8 6 l 8 -6" fill="none" stroke="${OUT}" stroke-width="3" stroke-linecap="round"/>`;
  return g+`</g>`}

/* ---------- the bedroom ---------- */
const BED=`<g><rect x="1210" y="700" width="400" height="205" rx="18" fill="#8fb4e8" stroke="${OUT}" stroke-width="5"/><rect x="1210" y="770" width="400" height="135" rx="14" fill="#ffd3e0" stroke="${OUT}" stroke-width="5"/><rect x="1450" y="676" width="150" height="76" rx="26" fill="#fff" stroke="${OUT}" stroke-width="5"/><rect x="1580" y="610" width="40" height="295" rx="12" fill="#a06a40" stroke="${OUT}" stroke-width="5"/></g>`;
const BLANKET=`<rect x="1210" y="770" width="400" height="135" rx="14" fill="#ffd3e0" stroke="${OUT}" stroke-width="5"/>`;
const BG4=`<rect width="1920" height="1080" fill="#e9f2dc"/><rect x="0" y="560" width="1920" height="345" fill="#bcd9a8"/><rect x="0" y="548" width="1920" height="16" fill="#9cc487"/>
<rect x="0" y="${FLOOR}" width="1920" height="175" fill="#dcae7e"/><rect x="0" y="${FLOOR}" width="1920" height="10" fill="#bf8f5f"/>
${[[1000,470],[1130,500],[1560,470],[960,150],[1560,90]].map(([x,y],i)=>star(x,y,20,i,i%2?'#ffb3c7':SUN,.9)).join('')}
<ellipse cx="1150" cy="975" rx="420" ry="50" fill="#ffb3c7"/>`;
function door(dop){return `<rect x="1650" y="270" width="230" height="640" fill="#fff3c4"/><rect x="${n(1650+dop*150)}" y="270" width="${n(230-dop*150)}" height="640" fill="#9a6642" stroke="${OUT}" stroke-width="5"/><rect x="${n(1674+dop*150)}" y="602" width="46" height="16" rx="8" fill="#f6c453" stroke="${OUT}" stroke-width="4"/><rect x="1638" y="258" width="254" height="664" fill="none" stroke="#7a4d30" stroke-width="16"/>`}
// room(t, {dop, night, inside: svg drawn inside the mirror, chars: svg in the room, overGlass: svg on the glass})
function room(t,o){
  let g=BG4+`<g transform="translate(1060,0)">${WINDOW(false)}</g>`+wallClock(1010,240,62,t,true)+BED+door(o.dop||0);
  g+=o.chars||'';
  if(o.night>0)g+=`<rect width="1920" height="1080" fill="${NIGHT}" opacity="${n(o.night*.74)}"/><g opacity="${n(o.night)}" transform="translate(1060,0)">${WINDOW(true)}</g>`+(o.nightChars||'');
  g+=`<g clip-path="url(#mc2)"><rect x="290" y="150" width="620" height="770" fill="#211b4d"/>${farMirrors(t,.5)}${o.inside||''}<rect x="290" y="150" width="620" height="770" fill="#7fb4ff" opacity=".07"/>${o.overGlass||''}${SHINE(600)}</g>`+MIRROR_FRAME(290);
  return g}
const pound=(t,amt)=>({aL:8+amt*(52+40*Math.sin(t*10+PI)),aR:8+amt*(88+34*Math.sin(t*10)),mouth:amt*(.5+.4*Math.abs(Math.sin(t*10))),bob:-amt*Math.abs(Math.sin(t*10))*8,tilt:amt*4});

/* ================= Episode 4: What If Every Mirror Was a Door? ================= */
const KF=(k,t)=>{if(t<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++){if(t<=k[i+1][0])return lerp(k[i][1],k[i+1][1],ease((t-k[i][0])/Math.max(.001,k[i+1][0]-k[i][0])))}return k[k.length-1][1]};
const mv=(k,t)=>Math.abs(KF(k,t+.06)-KF(k,t-.06))>.5;
const stepWalk=(p,k,t,sp=6)=>{if(mv(k,t)){p.walk=t*sp;p.bob=(p.bob||0)-Math.abs(Math.sin(t*sp))*5}return p};
const SH='#0e0b2c';
// a waiting thing: no face, only eyes
function shape(o){const c=Object.assign({x:0,y:FLOOR,s:1,arm:0,look:0,op:1,eyes:1,side:1},o),r=Math.min(c.arm,125)*PI/180,sd=c.side,ex=sd*(64+Math.sin(r)*118),ey=-228+Math.cos(r)*118;
