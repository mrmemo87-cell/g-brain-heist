name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (portal guard, typecheck, build, test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: School admin portal integrity guard
        run: npm run guard:school-admin-portal

      - name: Typecheck
        run: npm run typecheck

      - name: Supabase migration security guard
        run: npm run security:migrations

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
