name: Android release bundle

# Builds the Google Play release bundle (.aab). Run it from the Actions tab ("Run workflow").
# If the ANDROID_UPLOAD_* secrets are set, the bundle is signed with the private upload key here;
# otherwise it is published unsigned to the "android-release" draft and signed with jarsigner before upload.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  aab:
    name: Build Android release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Play needs every upload to have a higher versionCode; the run number keeps it growing.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install
        run: npm ci

      - name: Build web app for the native shell
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then export VITE_SUPABASE_URL="$(grep '^VITE_SUPABASE_URL=' .env.example | cut -d= -f2-)"; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then export VITE_SUPABASE_ANON_KEY="$(grep '^VITE_SUPABASE_ANON_KEY=' .env.example | cut -d= -f2-)"; fi
          export VITE_SITE_URL=https://www.brainsheist.com
          export VITE_SUPABASE_AUTH_REDIRECT_URL=https://www.brainsheist.com/auth/callback
          npm run build
          node scripts/prepare-native-web.mjs

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Restore upload key (only when the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release bundle
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Publish bundle to the android-release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="brains-heist-${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$NAME"
          ls -lh "$NAME"
          NOTES="Google Play bundle ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}) from ${GITHUB_SHA::7}."
          if [ -z "${ANDROID_UPLOAD_KEYSTORE_FILE:-}" ]; then NOTES="$NOTES Unsigned: sign with the upload key before uploading."; fi
          if gh release view android-release >/dev/null 2>&1; then
            gh release upload android-release "$NAME" --clobber
            gh release edit android-release --notes "$NOTES"
          else
            gh release create android-release "$NAME" --draft --title "Android Play bundle" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
