name: Agent teacher report performance patch
on:
  push:
    branches:
      - agent/teacher-report-performance
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teacher-report-performance
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply report performance patches
        run: |
          python3 scripts/patch_teacher_report_performance.py
          python3 scripts/patch_teacher_report_cancel.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused report regression tests
        run: |
          npm run test:clean
          npm run test:build
          NODE_ENV=test VITE_SUPABASE_URL=http://localhost VITE_SUPABASE_ANON_KEY=test node --test dist-tests/tests/teacherAssignmentReportPerformance.test.js
      - name: Production build
        run: npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit validated performance fix
        run: |
          rm -f .github/workflows/agent-teacher-report-performance.yml scripts/patch_teacher_report_performance.py scripts/patch_teacher_report_cancel.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize teacher assignment report loading"
          git push
