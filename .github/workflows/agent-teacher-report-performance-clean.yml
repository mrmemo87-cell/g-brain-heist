name: Agent teacher report performance clean
on:
  push:
    branches:
      - agent/teacher-report-performance-clean
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teacher-report-performance-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply report performance patch
        run: python3 scripts/patch_teacher_report_performance.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused report regression tests
        run: |
          npm run test:clean
          npm run test:build
          NODE_ENV=test VITE_SUPABASE_URL=http://localhost VITE_SUPABASE_ANON_KEY=test node --test dist-tests/tests/teacherAssignmentReportPerformance.test.js
      - name: Production build
        run: npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit only validated report fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/TeacherPortal.tsx supabase/migrations/20260828230500_teacher_assignment_report_performance.sql tests/teacherAssignmentReportPerformance.test.ts
          git rm .github/workflows/agent-teacher-report-performance-clean.yml scripts/patch_teacher_report_performance.py
          git commit -m "Optimize teacher assignment report loading"
          git push
