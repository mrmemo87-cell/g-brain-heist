name: One-shot clean theme scope

on:
  push:
    branches:
      - "fix/login-theme-superadmin-contrast-clean"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-theme-superadmin-contrast-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/one_shot_theme_scope_patch_clean.py
      - name: Preserve intended files before verification materializers run
        run: |
          mkdir -p /tmp/theme-fix/src/contexts /tmp/theme-fix/src/styles /tmp/theme-fix/tests
          cp index.tsx /tmp/theme-fix/index.tsx
          cp src/contexts/LightModeContext.tsx /tmp/theme-fix/src/contexts/LightModeContext.tsx
          cp src/styles/platform-light-theme.css /tmp/theme-fix/src/styles/platform-light-theme.css
          cp tests/platformLightTheme.test.ts /tmp/theme-fix/tests/platformLightTheme.test.ts
      - run: npm run verify
      - name: Restore only verified intended changes
        run: |
          git reset --hard HEAD
          cp /tmp/theme-fix/index.tsx index.tsx
          cp /tmp/theme-fix/src/contexts/LightModeContext.tsx src/contexts/LightModeContext.tsx
          cp /tmp/theme-fix/src/styles/platform-light-theme.css src/styles/platform-light-theme.css
          cp /tmp/theme-fix/tests/platformLightTheme.test.ts tests/platformLightTheme.test.ts
          rm -f .github/workflows/one-shot-theme-scope-clean.yml scripts/one_shot_theme_scope_patch_clean.py
          git status --short
      - name: Commit clean verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.tsx src/contexts/LightModeContext.tsx src/styles/platform-light-theme.css tests/platformLightTheme.test.ts .github/workflows/one-shot-theme-scope-clean.yml scripts/one_shot_theme_scope_patch_clean.py
          git commit -m "Restore public login UX and improve Superadmin contrast"
          git push origin HEAD:fix/login-theme-superadmin-contrast-clean
