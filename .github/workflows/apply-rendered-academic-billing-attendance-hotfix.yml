name: Apply rendered academic billing attendance hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/rendered-academic-billing-attendance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded rendered-state patch
        run: python .github/scripts/apply_rendered_academic_billing_attendance_hotfix.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused regression test
        run: |
          npm run test:clean
          npm run test:build
          NODE_ENV=test VITE_SUPABASE_URL=http://localhost VITE_SUPABASE_ANON_KEY=test node --test dist-tests/tests/renderedAcademicBillingAttendanceHotfix.test.js

      - name: Build
        run: npm run build

      - name: Remove temporary harness and generated tests
        run: |
          rm -f .github/scripts/apply_rendered_academic_billing_attendance_hotfix.py
          rm -f .github/workflows/apply-rendered-academic-billing-attendance-hotfix.yml
          rm -rf dist-tests

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix rendered report, billing and attendance UI"
          git push origin HEAD:${{ github.head_ref }}
