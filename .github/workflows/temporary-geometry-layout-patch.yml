name: Temporary geometry layout patch

on:
  push:
    branches: [fix/geometry-preserve-layout-20260830]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geometry-preserve-layout-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Wire live stage into question export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('components/geometry/DiagramBuilder.tsx')
          text = path.read_text()
          old = "              shapes={shapes}\n              blanks={blanks}\n              onUseInQuestion={onUseInQuestion}"
          new = "              shapes={shapes}\n              blanks={blanks}\n              stageRef={stageRef}\n              onUseInQuestion={onUseInQuestion}"
          if old not in text:
              raise SystemExit('GeometryUseInQuestion wiring target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install
        run: npm ci
      - name: Pre-PR verification
        run: npm run prepr
      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-geometry-layout-patch.yml
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/geometry/DiagramBuilder.tsx .github/workflows/temporary-geometry-layout-patch.yml
          git commit -m "Preserve exact Geometry Builder layout in question exports"
          git push origin HEAD:fix/geometry-preserve-layout-20260830
