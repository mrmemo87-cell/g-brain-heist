name: Temporary PR patch runner for manual question restoration
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch-validate:
    if: github.head_ref == 'fix/restore-manual-question-creation-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-manual-question-creation-20260830
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply restoration patch
        run: python3 scripts/patch_restore_manual_question_creation.py
      - name: Verify routing contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          portal = Path('components/TeacherPortal.tsx').read_text(encoding='utf-8')
          bank = Path('components/teacher/QuestionBank.tsx').read_text(encoding='utf-8')
          assert "const openMyPoolQuestionForm" in portal
          assert "setView('create-question')" in portal
          assert "const openQuestionBatchWorkspace" in portal
          assert "setView('question-batch')" in portal
          assert "onCreateQuestion={openMyPoolQuestionForm}" in portal
          assert "onCreateQuestionBatch={openQuestionBatchWorkspace}" in portal
          assert ">Add Question</button>" in bank
          assert ">Add Question Batch</button>" in bank
          assert ">Upload question PDF</button>" in bank
          assert "openMyPoolQuestionForm('Maths', asset.topic || 'Geometry')" in portal
          PY
      - name: Diff check
        run: git diff --check
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/TeacherPortal.tsx components/teacher/QuestionBank.tsx tests/manualQuestionCreationRouting.test.ts
          git rm .github/workflows/temporary-restore-manual-question-creation.yml scripts/patch_restore_manual_question_creation.py
          git commit -m "Restore manual question creation alongside PDF batches"
          git push origin HEAD:fix/restore-manual-question-creation-20260830
