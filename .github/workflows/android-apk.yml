name: Android test APK

# Builds an installable Android test app (debug APK) from the current code.
# Download it from the run's "Artifacts" section and install it on an Android phone.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/native/**'
      - 'src/lib/nativePlatform.ts'
      - 'scripts/prepare-native-web.mjs'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/native/**'
      - 'src/lib/nativePlatform.ts'
      - 'scripts/prepare-native-web.mjs'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write # only used on main, to update the "android-test" pre-release with the newest APK

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install
        run: npm ci

      - name: Build web app for the native shell
        # The Supabase URL and anon key are public client values (they ship in every web page);
        # repository variables override the defaults from .env.example when set.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then export VITE_SUPABASE_URL="$(grep '^VITE_SUPABASE_URL=' .env.example | cut -d= -f2-)"; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then export VITE_SUPABASE_ANON_KEY="$(grep '^VITE_SUPABASE_ANON_KEY=' .env.example | cut -d= -f2-)"; fi
          export VITE_SITE_URL=https://www.brainsheist.com
          export VITE_SUPABASE_AUTH_REDIRECT_URL=https://www.brainsheist.com/auth/callback
          npm run build
          node scripts/prepare-native-web.mjs

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK size
        run: ls -lh android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: brains-heist-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish to the android-test pre-release (main only)
        # Gives a fixed phone-friendly link:
        # https://github.com/${{ github.repository }}/releases/download/android-test/brains-heist-test.apk
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk brains-heist-test.apk
          NOTES="Test build of the Brains Heist Android app from ${GITHUB_SHA::7}. Not for the Play Store."
          if gh release view android-test >/dev/null 2>&1; then
            gh release upload android-test brains-heist-test.apk --clobber
            gh release edit android-test --notes "$NOTES"
          else
            gh release create android-test brains-heist-test.apk --prerelease --title "Android test app" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
