name: Patch school invite setup

on:
  push:
    branches:
      - fix/school-invite-setup-flow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-invite-setup-flow
          fetch-depth: 0
      - name: Patch SetupWizard
        run: node scripts/patch-school-invite-setup.mjs
      - name: Commit patch
        run: |
          if git diff --quiet -- components/onboarding/SetupWizard.tsx; then
            echo "SetupWizard already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/onboarding/SetupWizard.tsx
          git commit -m "Fix school invite setup flow"
          git push origin HEAD:fix/school-invite-setup-flow
