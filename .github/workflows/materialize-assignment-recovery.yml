name: Materialize assignment recovery
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-assignment-recovery.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/assignment-edit-publishing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply assignment feature patch
        run: python3 scripts/patch_assignment_edit_feature.py
      - name: Apply follow-up corrections
        run: python3 scripts/fix_assignment_patch_output.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit materialized source
        run: |
          rm -f .github/workflows/agent-assignment-edit-patch.yml scripts/patch_assignment_edit_feature.py scripts/fix_assignment_patch_output.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize assignment editing and publication controls"
          git push origin HEAD:agent/assignment-edit-publishing
