name: One-shot academic year rollover hardening
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch-rollover-surfaces:
    if: github.head_ref == 'harden-academic-year-rollover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harden-academic-year-rollover
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair one-shot patcher marker
        run: python3 scripts/fix_rollover_patcher.py
      - name: Patch rollover surfaces
        run: python3 scripts/patch_academic_year_rollover_surfaces.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck patched surfaces
        run: npm run typecheck
      - name: Commit rollover hardening
        run: |
          rm -f .github/workflows/agent-academic-year-rollover-patch.yml scripts/patch_academic_year_rollover_surfaces.py scripts/fix_rollover_patcher.py scripts/.rollover-patch-ready scripts/.noop docs/.rollover-pr-note docs/.noop2 docs/.noop3 docs/.noop4 docs/.noop5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden academic year rollover surfaces"
          git push
