name: Temporary programme card artwork fit

on:
  push:
    branches:
      - feat/program-artwork-system-final

permissions:
  contents: write

jobs:
  patch-program-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/program-artwork-system-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch School Head programme cards
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          portal = Path('components/SchoolHeadPortal.tsx')
          text = portal.read_text()
          old = """{programCards.length > 0 ? <section className=\"school-head-program-grid\">{programCards.map((program) => <article key={program.name}><img src={program.artwork.src} alt=\"\" loading=\"lazy\" decoding=\"async\" style={{ width: 'calc(100% + 2.2rem)', height: 'clamp(6.75rem, 9vw, 8.25rem)', margin: '-1.1rem -1.1rem .85rem', objectFit: 'cover', objectPosition: program.artwork.objectPosition }} /><div><span>{program.name.split(' ').map((word) => word[0]).join('').slice(0, 2)}</span><b>School programme</b></div><h3 style={{ margin: '.65rem 0 0', color: 'var(--head-ink)', fontSize: '.88rem', fontWeight: 850 }}>{program.name}</h3><strong>{program.metric}</strong><small>{program.label}</small><p>{program.description}</p><button type=\"button\" onClick={() => openAdministration(program.tab)}>Open programme <span aria-hidden=\"true\">→</span></button></article>)}</section> : ("""
          new = """{programCards.length > 0 ? <section className=\"school-head-program-grid\">{programCards.map((program) => <article key={program.name}><div className=\"school-head-program-art\"><img src={program.artwork.src} alt=\"\" loading=\"lazy\" decoding=\"async\" /></div><div className=\"school-head-program-meta\"><b>School programme</b></div><h3 style={{ margin: '.65rem 0 0', color: 'var(--head-ink)', fontSize: '.88rem', fontWeight: 850 }}>{program.name}</h3><strong>{program.metric}</strong><small>{program.label}</small><p>{program.description}</p><button type=\"button\" onClick={() => openAdministration(program.tab)}>Open programme <span aria-hidden=\"true\">→</span></button></article>)}</section> : ("""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one School Head programme-card render block, found {text.count(old)}')
          portal.write_text(text.replace(old, new))

          css = Path('src/styles/school-head.css')
          css_text = css.read_text()
          marker = '/* School Head programme artwork: preserve complete programme identity artwork. */'
          if marker in css_text:
              raise SystemExit('Programme artwork override already exists')
          css_text += """

/* School Head programme artwork: preserve complete programme identity artwork. */
.school-head-program-art {
  display: flex !important;
  height: clamp(6.5rem, 8vw, 7.25rem);
  align-items: center !important;
  justify-content: center !important;
  margin: -1.1rem -1.1rem .85rem;
  padding: 1rem 1.25rem;
  overflow: hidden;
  border-bottom: 1px solid var(--head-border);
  background: linear-gradient(180deg, #fbfdff 0%, #f4f8fb 100%);
}
.school-head-program-art img {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  object-position: center;
}
.school-head-program-meta {
  justify-content: flex-end !important;
}
"""
          css.write_text(css_text)
          PY

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check

      - name: Commit clean source patch
        shell: bash
        run: |
          rm .github/workflows/tmp-program-art-card-fit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SchoolHeadPortal.tsx src/styles/school-head.css .github/workflows/tmp-program-art-card-fit.yml
          git commit -m "Refine School Head programme artwork fit"
          git push origin HEAD:feat/program-artwork-system-final
