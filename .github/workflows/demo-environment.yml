name: Demo environment

# Builds and refreshes the isolated "Try the demo" database (Supabase project
# brains-heist-demo, ref lvkmkgjpcbdyzdkbqcgc).
#
# Production is only ever READ (pg_dump / supabase db dump). Every write goes to the demo project.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   BH_PROD_DB_URL  session-pooler connection string of the production project (sozodkxwhubespiedgxm)
#   BH_DEMO_DB_URL  session-pooler connection string of the demo project (lvkmkgjpcbdyzdkbqcgc)
#   BH_DEMO_OPS_PASSWORD (optional) password for the demo platform-admin login demo.ops@example.com,
#                   which sees the visitor analytics. Unset = random, unknown password.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'clone = copy schema + content from production, then seed. reset = re-seed the demo school only.'
        type: choice
        options: [reset, clone]
        default: reset
      stop_after:
        description: 'Development only: run seed files up to and including this prefix (e.g. 04). Empty = all.'
        type: string
        default: ''
  schedule:
    # Nightly demo reset at 02:20 Asia/Bishkek (20:20 UTC)
    - cron: '20 20 * * *'

permissions:
  contents: read

concurrency:
  group: demo-environment
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROD_DB_URL: ${{ secrets.BH_PROD_DB_URL }}
      DEMO_DB_URL: ${{ secrets.BH_DEMO_DB_URL }}
      MODE: ${{ github.event.inputs.mode || 'reset' }}
      STOP_AFTER: ${{ github.event.inputs.stop_after || '' }}
      BH_DEMO_OPS_PASSWORD: ${{ secrets.BH_DEMO_OPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Safety check on connection strings
        run: |
          set -euo pipefail
          fail() { echo "::error title=Demo safety check::$1"; exit 1; }
          shape() { # non-secret description of a connection string
            local u="$1"
            [[ -z "$u" ]] && { echo "empty"; return; }
            local scheme="${u%%://*}"
            local ref; ref=$(echo "$u" | grep -oE 'postgres\.[a-z0-9]{20}' | head -1 || true)
            local placeholder="no"; [[ "$u" == *YOUR-PASSWORD* ]] && placeholder="yes"
            echo "scheme=${scheme:0:12} user=${ref:-none} placeholder=${placeholder} length=${#u}"
          }
          echo "::notice title=BH_DEMO_DB_URL::$(shape "${DEMO_DB_URL}")"
          echo "::notice title=BH_PROD_DB_URL::$(shape "${PROD_DB_URL}")"
          [[ -n "${DEMO_DB_URL}" ]] || fail "BH_DEMO_DB_URL secret is missing or empty"
          [[ "${DEMO_DB_URL}" == postgres* ]] || fail "BH_DEMO_DB_URL must be the single postgresql:// line"
          [[ "${DEMO_DB_URL}" == *lvkmkgjpcbdyzdkbqcgc* ]] || fail "BH_DEMO_DB_URL is not the demo project"
          [[ "${DEMO_DB_URL}" != *sozodkxwhubespiedgxm* ]] || fail "BH_DEMO_DB_URL points at production"
          [[ "${DEMO_DB_URL}" != *YOUR-PASSWORD* ]] || fail "BH_DEMO_DB_URL still has the [YOUR-PASSWORD] placeholder"
          [[ -n "${PROD_DB_URL}" ]] || fail "BH_PROD_DB_URL secret is missing or empty (needed to sync database changes)"
          if [[ "${MODE}" == "clone" ]]; then
            [[ -n "${PROD_DB_URL}" ]] || fail "BH_PROD_DB_URL secret is missing or empty"
            [[ "${PROD_DB_URL}" == postgres* ]] || fail "BH_PROD_DB_URL must be the single postgresql:// line"
            [[ "${PROD_DB_URL}" == *sozodkxwhubespiedgxm* ]] || fail "BH_PROD_DB_URL is not the production project"
            [[ "${PROD_DB_URL}" != *YOUR-PASSWORD* ]] || fail "BH_PROD_DB_URL still has the [YOUR-PASSWORD] placeholder"
          fi

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - uses: supabase/setup-cli@v1
        if: env.MODE == 'clone'
        with:
          version: latest

      - name: Refuse to clone over an existing demo schema
        if: env.MODE == 'clone'
        run: |
          set -euo pipefail
          exists=$(psql "$DEMO_DB_URL" -tAc "select to_regclass('public.users') is not null")
          if [[ "$exists" == "t" ]]; then
            echo "Demo project already has the schema. Use mode=reset, or wipe the demo project first."
            exit 1
          fi

      - name: Dump production schema (read-only)
        if: env.MODE == 'clone'
        run: |
          set -euo pipefail
          mkdir -p dump
          supabase db dump --db-url "$PROD_DB_URL" -f dump/schema.sql
          wc -c dump/schema.sql

      - name: Dump production content tables (read-only)
        if: env.MODE == 'clone'
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do
            t="${t%%#*}"; t="$(echo "$t" | xargs)"
            [[ -z "$t" ]] && continue
            args+=(--table="$t")
          done < supabase/demo/content-tables.txt
          pg_dump "$PROD_DB_URL" --data-only --no-owner --no-privileges "${args[@]}" -f dump/content.sql
          wc -c dump/content.sql

      - name: Restore schema + content into demo
        if: env.MODE == 'clone'
        run: |
          set -euo pipefail
          # The demo database is far from the GitHub runner, so statement-by-statement
          # psql is latency bound (~1 h). Send the schema as ONE simple-query batch
          # and the data with COPY, all inside a single transaction.
          python3 -m pip install --quiet --break-system-packages "psycopg[binary]>=3.2"
          python3 supabase/demo/restore.py dump/schema.sql dump/content.sql

      - name: Isolate demo (no outbound email/push/http) and schedule engine jobs
        if: env.MODE == 'clone'
        run: |
          set -euo pipefail
          psql "$DEMO_DB_URL" -v ON_ERROR_STOP=1 --file supabase/demo/post-restore.sql
          # Record which production migration the copied schema corresponds to.
          v=$(psql "$PROD_DB_URL" -tAc "select max(version) from supabase_migrations.schema_migrations")
          psql "$DEMO_DB_URL" -v ON_ERROR_STOP=1 -c "create table if not exists private.demo_applied_migrations(version text primary key, name text, applied_at timestamptz not null default now()); revoke all on private.demo_applied_migrations from public, anon, authenticated; insert into private.demo_applied_migrations(version, name) values ('$v', 'baseline: schema copy') on conflict do nothing;"

      - name: Apply new production database changes to the demo (reads production only)
        run: |
          python3 -m pip install --quiet --break-system-packages "psycopg[binary]>=3.2"
          python3 supabase/demo/sync_migrations.py

      - name: Reset and seed the demo school (one transaction)
        run: |
          set -euo pipefail
          {
            echo "create table if not exists private.demo_content_tables(name text primary key);"
            echo "revoke all on private.demo_content_tables from public, anon, authenticated;"
            while IFS= read -r t; do
              t="${t%%#*}"; t="$(echo "$t" | xargs)"
              [[ -z "$t" ]] && continue
              echo "insert into private.demo_content_tables(name) values ('$t') on conflict do nothing;"
            done < supabase/demo/content-tables.txt
          } > /tmp/content_list.sql
          args=(-v ON_ERROR_STOP=1 --single-transaction -c 'set statement_timeout = 0' -v "ops_password=${BH_DEMO_OPS_PASSWORD}" -f /tmp/content_list.sql)
          for f in supabase/demo/seed/*.sql; do
            args+=(-f "$f")
            if [[ -n "${STOP_AFTER}" && "$(basename "$f")" == "${STOP_AFTER}"* ]]; then break; fi
          done
          if ! psql "$DEMO_DB_URL" "${args[@]}" > /tmp/seed.out 2> /tmp/seed.err; then
            msg=$(grep -E "ERROR|CONTEXT|psql:" /tmp/seed.err | head -c 1800 | tr '\n' ' ')
            echo "::error title=Demo seed failed (nothing was changed)::${msg}"
            exit 1
          fi
          echo "::notice title=Demo seed::Demo school rebuilt for $(TZ=Asia/Bishkek date +%F)"
