name: One-shot admin cleanup v2

on:
  push:
    branches:
      - fix-admin-filters-cambridge-light-theme

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-admin-filters-cambridge-light-theme
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply guarded production cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # Load the professional palette after all legacy global styles.
          path = Path('index.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "import './src/styles/light-mode.css';",
              "import './src/styles/light-mode.css';\nimport './src/styles/platform-light-theme.css';",
              'index light theme import',
          )
          path.write_text(text)

          # Palette is always on; the existing LightMode toggle remains a performance preference.
          path = Path('src/contexts/LightModeContext.tsx')
          text = path.read_text()
          anchor = "  const [autoEnabledReason, setAutoEnabledReason] = useState<string | null>(null);"
          insertion = """  const [autoEnabledReason, setAutoEnabledReason] = useState<string | null>(null);\n\n  useEffect(() => {\n    document.body.classList.add('platform-light-theme');\n    return () => {\n      document.body.classList.remove('platform-light-theme');\n    };\n  }, []);"""
          text = replace_once(text, anchor, insertion, 'platform theme body class')
          path.write_text(text)

          # Superadmin portal: server-backed platform-wide user filters + governed Cambridge RPC only.
          path = Path('components/AdminPortal.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "  const [searchQuery, setSearchQuery] = useState('');\n  const [userPage, setUserPage] = useState(0);",
              "  const [searchQuery, setSearchQuery] = useState('');\n  const [userRoleFilter, setUserRoleFilter] = useState('all');\n  const [userGradeFilter, setUserGradeFilter] = useState('all');\n  const [userSchoolFilter, setUserSchoolFilter] = useState('all');\n  const [userStatusFilter, setUserStatusFilter] = useState('all');\n  const [userSortKey, setUserSortKey] = useState<'last-active' | 'name' | 'xp' | 'level'>('last-active');\n  const [userPage, setUserPage] = useState(0);",
              'admin user filter state',
          )

          quiz_start = text.index('  // Fetch Cambridge Quiz Scores')
          quiz_end = text.index('\n\n  const loadSchoolRequests', quiz_start)
          quiz_block = """  // Fetch Cambridge reports only through the governed SECURITY DEFINER RPC.\n  // Direct table fallbacks are intentionally forbidden by the Cambridge security model.\n  const fetchQuizScores = async () => {\n    setQuizScoresLoading(true);\n    try {\n      const { data, error } = await supabase.rpc('get_school_cambridge_scores', { p_limit: 500 });\n      if (error) throw error;\n\n      const scores = Array.isArray(data) ? data : [];\n      setQuizScores(scores);\n      calculateQuizStats(scores);\n    } catch (error) {\n      setQuizScores([]);\n      calculateQuizStats([]);\n      reportRpcError('Failed to fetch Cambridge reports:', error, 'Failed to load Cambridge reports.');\n    } finally {\n      setQuizScoresLoading(false);\n    }\n  };"""
          text = text[:quiz_start] + quiz_block + text[quiz_end:]

          users_start = text.index('  const fetchUsers = useCallback(')
          users_end = text.index('\n\n  const refreshAdminData = useCallback', users_start)
          users_block = """  const fetchUsers = useCallback(\n    async (page = 0, query = '') => {\n      setUsersLoading(true);\n      setUsersError(null);\n      try {\n        const superadminParams = {\n          p_limit: PAGE_SIZE,\n          p_offset: page * PAGE_SIZE,\n          p_search: query.trim() || null,\n          p_role: userRoleFilter === 'all' ? null : userRoleFilter,\n          p_grade: userGradeFilter === 'all' ? null : Number.parseInt(userGradeFilter, 10),\n          p_school_id: userSchoolFilter === 'all' ? null : userSchoolFilter,\n          p_status: userStatusFilter === 'all' ? null : userStatusFilter,\n          p_sort: userSortKey,\n        };\n        const regularAdminParams = {\n          p_limit: PAGE_SIZE,\n          p_offset: page * PAGE_SIZE,\n          p_search: query.trim() || null,\n        };\n        const { data, error } = isSuperadmin\n          ? await supabase.rpc('rpc_superadmin_list_users', superadminParams)\n          : await supabase.rpc('rpc_admin_list_users', regularAdminParams);\n        if (error) throw error;\n\n        const rows = Array.isArray(data) ? data : [];\n        setUsers(rows);\n        setHasNextPage(rows.length === PAGE_SIZE);\n      } catch (error: any) {\n        const message = error?.message || 'Failed to load users.';\n        setUsersError(message);\n        setUsers([]);\n        setHasNextPage(false);\n      } finally {\n        setUsersLoading(false);\n      }\n    },\n    [PAGE_SIZE, isSuperadmin, userGradeFilter, userRoleFilter, userSchoolFilter, userSortKey, userStatusFilter]\n  );"""
          text = text[:users_start] + users_block + text[users_end:]

          text = replace_once(
              text,
              "  useEffect(() => {\n    setUserPage(0);\n  }, [searchQuery]);",
              "  useEffect(() => {\n    setUserPage(0);\n  }, [searchQuery, userRoleFilter, userGradeFilter, userSchoolFilter, userStatusFilter, userSortKey]);",
              'reset user page when server filters change',
          )

          text = replace_once(
              text,
              "(activeTab === 'applications' || activeTab === 'schools') && (loadSchoolRequests(), loadSchoolOptions());",
              "(activeTab === 'applications' || activeTab === 'schools') && (loadSchoolRequests(), loadSchoolOptions());\n    if (activeTab === 'users') loadSchoolOptions();",
              'load schools for users filter',
          )

          text = replace_once(
              text,
              "    searchQuery, setSearchQuery, userPage, setUserPage, hasNextPage, PAGE_SIZE,",
              "    searchQuery, setSearchQuery,\n    userRoleFilter, setUserRoleFilter, userGradeFilter, setUserGradeFilter,\n    userSchoolFilter, setUserSchoolFilter, userStatusFilter, setUserStatusFilter, userSortKey, setUserSortKey,\n    userPage, setUserPage, hasNextPage, PAGE_SIZE,",
              'admin context user filters',
          )
          path.write_text(text)

          # Users tab controls now change the server query, not just the current 50-row page.
          path = Path('components/admin/tabs/UsersTab.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "    setShowCustomGrant, setUserBanState, setUserLevel, setUserPage, showCustomGrant, userPage,\n    users, usersError, usersLoading,",
              "    setShowCustomGrant, setUserBanState, setUserLevel, setUserPage, showCustomGrant, userPage,\n    userRoleFilter, setUserRoleFilter, userGradeFilter, setUserGradeFilter,\n    userSchoolFilter, setUserSchoolFilter, userStatusFilter, setUserStatusFilter, userSortKey, setUserSortKey,\n    users, usersError, usersLoading,",
              'users tab context filters',
          )
          old_locals = """  const [roleFilter, setRoleFilter] = useState('all');\n  const [gradeFilter, setGradeFilter] = useState('all');\n  const [schoolFilter, setSchoolFilter] = useState('all');\n  const [statusFilter, setStatusFilter] = useState('all');\n  const [sortKey, setSortKey] = useState<SortKey>('last-active');\n  const [selectedUserId, setSelectedUserId] = useState<string | null>(null);"""
          new_locals = """  const roleFilter = userRoleFilter;\n  const setRoleFilter = setUserRoleFilter;\n  const gradeFilter = userGradeFilter;\n  const setGradeFilter = setUserGradeFilter;\n  const schoolFilter = userSchoolFilter;\n  const setSchoolFilter = setUserSchoolFilter;\n  const statusFilter = userStatusFilter;\n  const setStatusFilter = setUserStatusFilter;\n  const sortKey: SortKey = userSortKey;\n  const setSortKey = setUserSortKey;\n  const [selectedUserId, setSelectedUserId] = useState<string | null>(null);"""
          text = replace_once(text, old_locals, new_locals, 'users local filters to context')

          sf_start = text.index('  const schoolFilterOptions = useMemo(')
          sf_end = text.index('\n\n  const filteredUsers = useMemo', sf_start)
          sf_block = """  const schoolFilterOptions = useMemo(\n    () => [...safeSchoolOptions].sort((a, b) => a.name.localeCompare(b.name)),\n    [safeSchoolOptions]\n  );"""
          text = text[:sf_start] + sf_block + text[sf_end:]
          text = replace_once(
              text,
              "      if (schoolFilter !== 'all' && schoolName(user) !== schoolFilter) return false;",
              "      if (schoolFilter !== 'all' && String(user?.school_id || '') !== schoolFilter) return false;",
              'users school filter uses school id',
          )
          text = replace_once(
              text,
              'Search is server-backed. Dropdown filters organize the currently loaded page without another network request.',
              'Search, role, grade, school, status and sorting are server-backed across the full platform dataset.',
              'users filter help text',
          )
          text = replace_once(
              text,
              "              {schoolFilterOptions.map((school) => <option key={school} value={school}>{school}</option>)}",
              "              {schoolFilterOptions.map((school) => <option key={school.id} value={school.id}>{school.name}</option>)}",
              'users school option objects',
          )
          text = replace_once(text, "              <option value=\"inactive\">Inactive</option>\n", "", 'remove undefined inactive user status filter')
          text = replace_once(
              text,
              '<section className="min-w-0 overflow-hidden rounded-2xl border border-slate-800/90 bg-[#0a1626]/88 shadow-[0_24px_70px_rgba(2,8,23,0.22)]">',
              '<section className="min-w-0 rounded-2xl border border-slate-800/90 bg-[#0a1626]/88 shadow-[0_24px_70px_rgba(2,8,23,0.22)]">',
              'users table section overflow',
          )
          text = replace_once(
              text,
              '<div className="min-w-0 overflow-x-auto">\n          <table className="w-full min-w-[1050px] text-left">',
              '<div className="w-full max-w-full overflow-x-auto overscroll-x-contain pb-2 [scrollbar-gutter:stable]">\n          <table className="w-max min-w-[1180px] text-left">',
              'users horizontal scroll container',
          )
          path.write_text(text)

          # Preserve school membership status from the live SchoolMember model.
          path = Path('services/schoolAdminService.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "  is_banned: boolean;\n  banned_until: string | null;",
              "  is_banned: boolean;\n  status?: string | null;\n  banned_until: string | null;",
              'school member status type',
          )
          text = replace_once(
              text,
              "      is_banned: !!row.is_banned,\n      banned_until: row.banned_until ?? null,",
              "      is_banned: !!row.is_banned,\n      status: row.status ?? 'active',\n      banned_until: row.banned_until ?? null,",
              'school member status mapping',
          )
          path.write_text(text)

          # Manual fallbacks also retain membership status when it exists.
          path = Path('components/AdminPortal.tsx')
          text = path.read_text()
          text = text.replace(
              "              is_banned: false,\n              joined_at: row.joined_at || '',",
              "              is_banned: false,\n              status: row.status || 'active',\n              joined_at: row.joined_at || '',",
              1,
          )
          text = text.replace(
              "              is_banned: false,\n              joined_at: row.created_at || '',",
              "              is_banned: false,\n              status: 'active',\n              joined_at: row.created_at || '',",
              1,
          )
          path.write_text(text)

          # Schools tab is explicitly selected-school-only, with useful member filters.
          path = Path('components/admin/tabs/SchoolsTab.tsx')
          text = path.read_text()
          text = replace_once(text, "import React from 'react';", "import React, { useMemo, useState } from 'react';", 'schools React hooks')
          text = replace_once(
              text,
              "  } = useAdmin();\n\n  return (",
              """  } = useAdmin();\n\n  const [memberRoleFilter, setMemberRoleFilter] = useState('all');\n  const [memberGradeFilter, setMemberGradeFilter] = useState('all');\n  const [memberStatusFilter, setMemberStatusFilter] = useState('active');\n\n  const visibleSchoolMembers = useMemo(() => {\n    if (!schoolAdminSchoolId) return [];\n    return filteredSchoolMembers.filter((member: any) => {\n      if (memberRoleFilter !== 'all' && member.role !== memberRoleFilter) return false;\n      if (memberGradeFilter !== 'all' && String(member.grade ?? '') !== memberGradeFilter) return false;\n      const status = String(member.status || 'active').toLowerCase();\n      if (memberStatusFilter !== 'all' && status !== memberStatusFilter) return false;\n      return true;\n    });\n  }, [filteredSchoolMembers, memberGradeFilter, memberRoleFilter, memberStatusFilter, schoolAdminSchoolId]);\n\n  return (""",
              'schools filtered members state',
          )
          text = replace_once(
              text,
              "          <div className=\"mt-4 grid gap-3 md:grid-cols-[2fr,1fr]\">\n            <select\n              value={schoolAdminSchoolId}",
              "          <div className=\"mt-4 grid gap-3 md:grid-cols-2 xl:grid-cols-[2fr_1fr_1fr_1fr]\">\n            <select\n              value={schoolAdminSchoolId}",
              'schools filter grid',
          )
          text = replace_once(
              text,
              "                setSchoolMembersError(null);\n                if (selectedId) {",
              "                setSchoolMembersError(null);\n                setSchoolMemberSearch('');\n                setMemberRoleFilter('all');\n                setMemberGradeFilter('all');\n                setMemberStatusFilter('active');\n                if (selectedId) {",
              'schools reset filters on school change',
          )
          input_anchor = """            <input\n              type=\"text\"\n              value={schoolMemberSearch}\n              onChange={(event) => setSchoolMemberSearch(event.target.value)}\n              placeholder=\"Search username or email...\"\n              className=\"w-full rounded-lg border border-indigo-400/30 bg-black/40 px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-400\"\n            />"""
          input_with_filters = input_anchor + """\n            <select value={memberRoleFilter} onChange={(event) => setMemberRoleFilter(event.target.value)} className=\"w-full rounded-lg border border-indigo-400/30 bg-black/40 px-4 py-2 text-white\">\n              <option value=\"all\">All roles</option>\n              <option value=\"student\">Students</option>\n              <option value=\"teacher\">Teachers</option>\n              <option value=\"school_admin\">School admins</option>\n            </select>\n            <div className=\"grid grid-cols-2 gap-2\">\n              <select value={memberGradeFilter} onChange={(event) => setMemberGradeFilter(event.target.value)} className=\"w-full rounded-lg border border-indigo-400/30 bg-black/40 px-3 py-2 text-white\">\n                <option value=\"all\">All grades</option>\n                {[6, 7, 8, 9, 10, 11, 12].map((grade) => <option key={grade} value={String(grade)}>G{grade}</option>)}\n              </select>\n              <select value={memberStatusFilter} onChange={(event) => setMemberStatusFilter(event.target.value)} className=\"w-full rounded-lg border border-indigo-400/30 bg-black/40 px-3 py-2 text-white\">\n                <option value=\"active\">Active</option>\n                <option value=\"pending\">Pending</option>\n                <option value=\"suspended\">Suspended</option>\n                <option value=\"inactive\">Inactive</option>\n                <option value=\"all\">All statuses</option>\n              </select>\n            </div>"""
          text = replace_once(text, input_anchor, input_with_filters, 'schools role grade status filters')
          text = replace_once(text, 'filteredSchoolMembers.length === 0', 'visibleSchoolMembers.length === 0', 'schools empty state')
          text = replace_once(text, '{filteredSchoolMembers.length > 0 && (', '{schoolAdminSchoolId && visibleSchoolMembers.length > 0 && (', 'schools selected-only list')
          text = replace_once(
              text,
              'Showing {filteredSchoolMembers.length} member{filteredSchoolMembers.length !== 1 ?',
              'Selected school only · showing {visibleSchoolMembers.length} member{visibleSchoolMembers.length !== 1 ?',
              'schools count label',
          )
          text = replace_once(text, '{filteredSchoolMembers.map((member) => {', '{visibleSchoolMembers.map((member) => {', 'schools visible map')
          path.write_text(text)

          # Make dark modal backdrops stay usable while the content itself is light.
          path = Path('src/styles/platform-light-theme.css')
          text = path.read_text()
          backdrop_rule = """\n\nbody.platform-light-theme [class~="fixed"][class*="inset-0"][class*="bg-black/"] {\n  background-color: rgba(15, 23, 42, 0.38) !important;\n}\n"""
          if backdrop_rule.strip() not in text:
              text += backdrop_rule
          path.write_text(text)

          # Static production contracts for the regressions reported in this pass.
          path = Path('tests/superadminPortalUx.test.ts')
          text = path.read_text()
          if "superadmin user filters are server-backed" not in text:
              text += """\n\ntest('superadmin user filters are server-backed and the wide table owns horizontal scroll', () => {\n  assert.match(adminPortal, /rpc_superadmin_list_users/);\n  assert.match(adminPortal, /userRoleFilter/);\n  assert.match(adminPortal, /userSchoolFilter/);\n  assert.match(usersTab, /overscroll-x-contain/);\n  assert.match(usersTab, /min-w-\\[1180px\\]/);\n  assert.match(usersTab, /full platform dataset/);\n});\n\ntest('Cambridge reports keep the hardened RPC boundary without direct table fallback', () => {\n  assert.match(adminPortal, /get_school_cambridge_scores/);\n  assert.doesNotMatch(adminPortal, /from\\('quiz_scores'\\)\\s*\\.select\\('\\*'\\)/);\n});\n"""
          path.write_text(text)

          print('Guarded production cleanup applied successfully.')
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Supabase migration security guard
        run: npm run guard:supabase-migrations

      - name: Build
        run: npm run build

      - name: Full tests
        run: npm test

      - name: Diff hygiene
        run: git diff --check

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-admin-cleanup-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AdminPortal.tsx components/admin/tabs/UsersTab.tsx components/admin/tabs/SchoolsTab.tsx services/schoolAdminService.ts src/contexts/LightModeContext.tsx src/styles/platform-light-theme.css index.tsx tests/superadminPortalUx.test.ts tests/platformLightTheme.test.ts supabase/migrations/20260903141000_fix_superadmin_filters_and_cambridge_access.sql supabase/migrations/20260903141500_fix_superadmin_user_rpc_return_casts.sql .github/workflows/one-shot-admin-cleanup-v2.yml
          git commit -m "Fix admin filters Cambridge reporting and platform light theme"
          git push origin HEAD:fix-admin-filters-cambridge-light-theme
