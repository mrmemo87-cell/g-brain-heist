name: One-shot rollover PR cleanup
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  cleanup-rollover-pr:
    if: github.head_ref == 'harden-academic-year-rollover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harden-academic-year-rollover
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore clean TeacherPortal baseline
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- components/TeacherPortal.tsx
      - name: Apply report-only rollover changes
        run: python3 scripts/cleanup_rollover_teacher_portal.py
      - name: Preserve final TeacherPortal
        run: cp components/TeacherPortal.tsx /tmp/TeacherPortal.rollover.tsx
      - name: Install dependencies
        run: npm ci
      - name: Run repository typecheck
        run: npm run typecheck
      - name: Validate final cleaned TeacherPortal
        run: |
          cp /tmp/TeacherPortal.rollover.tsx components/TeacherPortal.tsx
          npx tsc --noEmit -p tsconfig.ci.json
      - name: Commit only the intended cleanup
        run: |
          cp /tmp/TeacherPortal.rollover.tsx components/TeacherPortal.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/TeacherPortal.tsx
          git rm -f .github/workflows/cleanup-rollover-pr.yml scripts/cleanup_rollover_teacher_portal.py
          git commit -m "Keep rollover report changes isolated"
          git push
