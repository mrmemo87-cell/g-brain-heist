name: One-off Academic Profile Reporting Integrity

on:
  push:
    branches:
      - fix/academic-profile-reporting-integrity-20260901
    paths:
      - .github/workflows/_oneoff_academic_profile_reporting_integrity.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/academic-profile-reporting-integrity-20260901
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create migration with Supabase CLI
        shell: bash
        run: |
          npx --yes supabase@latest migration new fix_academic_profile_reporting_integrity
          migration="$(ls -1t supabase/migrations/*_fix_academic_profile_reporting_integrity.sql | head -1)"
          echo "MIGRATION_PATH=$migration" >> "$GITHUB_ENV"

      - name: Apply reporting-integrity patch
        run: python3 scripts/_oneoff_patch_academic_profile_reporting_integrity.py "$MIGRATION_PATH"

      - name: Align reporting-integrity regression expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          school_test = Path('tests/studentAcademicProfileSchoolLanguage.test.ts')
          text = school_test.read_text(encoding='utf-8')
          text = text.replace(
              "  assert.equal(disclosures.length, 6);",
              "  assert.equal(disclosures.length, 7);\n  assert.match(source, /Evidence to confirm/);",
          )
          text = text.replace(
              "  assert.match(source, /sap-trend-line--\\$\\{trendSeries\\.tone\\}/);",
              "  assert.match(source, /comparableTrendSegments\\(trendSeries\\.events\\)/);\n  assert.match(source, /from previous comparable result/);",
          )
          text = text.replace(
              "  assert.match(source, /numbered point details/);",
              "  assert.match(source, /Trend lines only connect the same skill across separate assessment dates/);",
          )
          school_test.write_text(text, encoding='utf-8')

          lockdown_test = Path('tests/academicLockdownBillingPolish.test.ts')
          text = lockdown_test.read_text(encoding='utf-8')
          text = text.replace(
              "  const report = read('components/student-progress/IndividualStudentAcademicReportV2.tsx');\n  for (const source of [profile, report]) {",
              "  const report = read('components/student-progress/IndividualStudentAcademicReportV2.tsx');\n  const semantics = read('components/student-progress/academicReportingSemantics.ts');\n  for (const source of [profile, report]) {",
          )
          text = text.replace(
              "    assert.match(source, /No evidence in this period/);\n  }",
              "    assert.match(source, /summarizeComparableTrend/);\n  }\n  assert.match(semantics, /No evidence in this period/);\n  assert.match(semantics, /Not enough comparable evidence yet/);",
          )
          lockdown_test.write_text(text, encoding='utf-8')

          integrity_test = Path('tests/academicProfileReportingIntegrity.test.ts')
          text = integrity_test.read_text(encoding='utf-8')
          text = text.replace(
              "  assert.match(migration, /if v_latest = ''focus'' then/);\n  assert.match(migration, /v_status := ''insufficient_evidence''/);",
              "  assert.ok(migration.includes(\"if v_latest = ''focus'' then\"));\n  assert.ok(migration.includes(\"v_status := ''insufficient_evidence''\"));",
          )
          integrity_test.write_text(text, encoding='utf-8')
          PY

      - name: Normalize generated text whitespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for raw in changed:
              path = Path(raw)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              lines = [line.rstrip() for line in text.splitlines()]
              while lines and lines[-1] == '':
                  lines.pop()
              normalized = ('\n'.join(lines) + '\n') if lines else ''
              if normalized != text:
                  path.write_text(normalized, encoding='utf-8')
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Migration security checks
        run: npm run security:migrations

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Normalize post-build text whitespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for raw in changed:
              path = Path(raw)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              lines = [line.rstrip() for line in text.splitlines()]
              while lines and lines[-1] == '':
                  lines.pop()
              normalized = ('\n'.join(lines) + '\n') if lines else ''
              if normalized != text:
                  path.write_text(normalized, encoding='utf-8')
          PY

      - name: Whitespace check
        run: git diff --check

      - name: Remove one-off patch machinery
        run: rm .github/workflows/_oneoff_academic_profile_reporting_integrity.yml scripts/_oneoff_patch_academic_profile_reporting_integrity.py

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Academic Profile reporting integrity"
          git push origin HEAD:fix/academic-profile-reporting-integrity-20260901
