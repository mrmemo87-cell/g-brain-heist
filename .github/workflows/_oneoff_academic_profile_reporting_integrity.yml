name: One-off Academic Profile Reporting Integrity

on:
  push:
    branches:
      - fix/academic-profile-reporting-integrity-20260901
    paths:
      - .github/workflows/_oneoff_academic_profile_reporting_integrity.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/academic-profile-reporting-integrity-20260901
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create migration with Supabase CLI
        shell: bash
        run: |
          npx --yes supabase@latest migration new fix_academic_profile_reporting_integrity
          migration="$(ls -1t supabase/migrations/*_fix_academic_profile_reporting_integrity.sql | head -1)"
          echo "MIGRATION_PATH=$migration" >> "$GITHUB_ENV"

      - name: Apply reporting-integrity patch
        run: python3 scripts/_oneoff_patch_academic_profile_reporting_integrity.py "$MIGRATION_PATH"

      - name: Typecheck
        run: npm run typecheck

      - name: Migration security checks
        run: npm run security:migrations

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Whitespace check
        run: git diff --check

      - name: Remove one-off patch machinery
        run: rm .github/workflows/_oneoff_academic_profile_reporting_integrity.yml scripts/_oneoff_patch_academic_profile_reporting_integrity.py

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Academic Profile reporting integrity"
          git push origin HEAD:fix/academic-profile-reporting-integrity-20260901
