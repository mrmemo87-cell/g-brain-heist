name: One-off Academic Profile Reporting Integrity

on:
  push:
    branches:
      - fix/academic-profile-reporting-integrity-20260901
    paths:
      - .github/workflows/_oneoff_academic_profile_reporting_integrity.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/academic-profile-reporting-integrity-20260901
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create migration with Supabase CLI
        shell: bash
        run: |
          npx --yes supabase@latest migration new fix_academic_profile_reporting_integrity
          migration="$(ls -1t supabase/migrations/*_fix_academic_profile_reporting_integrity.sql | head -1)"
          echo "MIGRATION_PATH=$migration" >> "$GITHUB_ENV"

      - name: Apply reporting-integrity patch
        run: python3 scripts/_oneoff_patch_academic_profile_reporting_integrity.py "$MIGRATION_PATH"

      - name: Align reporting-integrity regression expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          school_test = Path('tests/studentAcademicProfileSchoolLanguage.test.ts')
          text = school_test.read_text(encoding='utf-8')
          text = text.replace(
              "  assert.match(source, /sap-trend-line--\\$\\{trendSeries\\.tone\\}/);",
              "  assert.match(source, /comparableTrendSegments\\(trendSeries\\.events\\)/);\n  assert.match(source, /from previous comparable result/);",
          )
          text = text.replace(
              "  assert.match(source, /numbered point details/);",
              "  assert.match(source, /Trend lines only connect the same skill across separate assessment dates/);",
          )
          school_test.write_text(text, encoding='utf-8')

          integrity_test = Path('tests/academicProfileReportingIntegrity.test.ts')
          text = integrity_test.read_text(encoding='utf-8')
          text = text.replace(
              "  assert.match(migration, /if v_latest = ''focus'' then/);\n  assert.match(migration, /v_status := ''insufficient_evidence''/);",
              "  assert.ok(migration.includes(\"if v_latest = ''focus'' then\"));\n  assert.ok(migration.includes(\"v_status := ''insufficient_evidence''\"));",
          )
          integrity_test.write_text(text, encoding='utf-8')
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Migration security checks
        run: npm run security:migrations

      - name: Test
        id: regression-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee academic-profile-test-output.txt

      - name: Upload regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-profile-test-output
          path: academic-profile-test-output.txt
          if-no-files-found: error

      - name: Enforce regression result
        if: steps.regression-tests.outcome != 'success'
        run: exit 1

      - name: Production build
        run: npm run build

      - name: Whitespace check
        run: git diff --check

      - name: Remove one-off patch machinery
        run: rm .github/workflows/_oneoff_academic_profile_reporting_integrity.yml scripts/_oneoff_patch_academic_profile_reporting_integrity.py academic-profile-test-output.txt

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Academic Profile reporting integrity"
          git push origin HEAD:fix/academic-profile-reporting-integrity-20260901
