name: Temporary school application professional flow patcher
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch-school-application-flow:
    if: github.head_ref == 'agent/school-application-professional-flow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/school-application-professional-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 scripts/patch_school_application_professional_flow.py
      - run: npm ci
      - run: npm run typecheck
      - name: Run tests with diagnostics
        shell: bash
        run: |
          set +e
          npm test > school_application_test_output.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add school_application_test_output.txt
            git commit -m "Capture school application test diagnostics"
            git push
            exit "$status"
          fi
          rm -f school_application_test_output.txt
      - run: npm run build
      - run: git diff --check
      - name: Commit validated school application flow
        run: |
          rm -f scripts/patch_school_application_professional_flow.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Professionalize school application onboarding"
          git push
