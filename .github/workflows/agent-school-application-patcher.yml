name: Temporary school application professional flow patcher
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch-school-application-flow:
    if: github.head_ref == 'agent/school-application-professional-flow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/school-application-professional-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 scripts/patch_school_application_professional_flow.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:clean
      - run: npm run test:build
      - name: Run school application regression tests
        run: NODE_ENV=test VITE_SUPABASE_URL=http://localhost VITE_SUPABASE_ANON_KEY=test node --test dist-tests/tests/schoolApplicationProfessionalFlow.test.js dist-tests/tests/schoolRequestEmailNotifications.test.js
      - run: npm run build
      - run: git diff --check
      - name: Commit validated school application flow
        run: |
          rm -f scripts/patch_school_application_professional_flow.py scripts/.school-flow-retry-1 school_application_test_output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Professionalize school application onboarding"
          git push
