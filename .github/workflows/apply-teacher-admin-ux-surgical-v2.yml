name: Apply teacher admin UX surgical v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/teacher-admin-ux-surgical-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded UX patch
        run: python .github/scripts/apply_teacher_admin_ux_surgical_v2.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused regression tests
        run: |
          npm run test:clean
          npm run test:build
          NODE_ENV=test VITE_SUPABASE_URL=http://localhost VITE_SUPABASE_ANON_KEY=test node --test dist-tests/tests/teacherAdminUxSurgicalV2.test.js

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Restore tracked generated test outputs
        run: git restore --source=HEAD --staged --worktree dist-tests || true

      - name: Remove temporary patch harness
        run: |
          rm .github/scripts/apply_teacher_admin_ux_surgical_v2.py
          rm .github/workflows/apply-teacher-admin-ux-surgical-v2.yml

      - name: Verify intended files only
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
            'components/TeacherPortal.tsx',
            'components/SettingsModal.tsx',
            'components/SchoolHeadPortal.tsx',
            'components/geometry/DiagramBuilder.tsx',
            'components/geometry/DiagramToolbar.tsx',
            'src/styles/teacher-theme.css',
            'tests/teacherAdminUxSurgicalV2.test.ts',
            '.github/scripts/apply_teacher_admin_ux_surgical_v2.py',
            '.github/workflows/apply-teacher-admin-ux-surgical-v2.yml',
          }
          changed = set(subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines())
          paths = {line[3:] for line in changed if len(line) > 3}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit('Unexpected generated/modified files: ' + ', '.join(unexpected))
          PY

      - name: Commit verified UX patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            components/TeacherPortal.tsx \
            components/SettingsModal.tsx \
            components/SchoolHeadPortal.tsx \
            components/geometry/DiagramBuilder.tsx \
            components/geometry/DiagramToolbar.tsx \
            src/styles/teacher-theme.css \
            tests/teacherAdminUxSurgicalV2.test.ts \
            .github/scripts/apply_teacher_admin_ux_surgical_v2.py \
            .github/workflows/apply-teacher-admin-ux-surgical-v2.yml
          git commit -m "Polish teacher navigation documents themes and diagrams"
          git push origin HEAD:${{ github.head_ref }}
