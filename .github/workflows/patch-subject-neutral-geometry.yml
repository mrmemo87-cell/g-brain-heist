name: Patch subject-neutral geometry assets

on:
  push:
    branches:
      - fix/subject-neutral-geometry-assets

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subject-neutral-geometry-assets
          fetch-depth: 0

      - name: Patch geometry asset flow
        shell: python
        run: |
          from pathlib import Path

          portal = Path('components/TeacherPortal.tsx')
          text = portal.read_text(encoding='utf-8')
          old = """              onUseInQuestion={(asset) => {\n                openMyPoolQuestionForm('Maths', asset.topic || 'Geometry');\n                setQuestionImage(null);\n                setQuestionImageUrl(asset.imageUrl);\n                setSubject('Maths');\n                setDifficulty(asset.difficulty);\n                setQuestionType('multiple_choice');\n                setQuestionText(asset.title === 'Geometry diagram' ? '' : asset.title);\n              }}"""
          new = """              onUseInQuestion={(asset) => {\n                const allowedSubject = teacherAssignedSubjects.includes(subject)\n                  ? subject\n                  : teacherAssignedSubjects[0] as Subject | undefined;\n                if (!allowedSubject) {\n                  brainsAlert('Your school admin must assign you to a subject before you can create a question from this visual.', 'info');\n                  return;\n                }\n                openMyPoolQuestionForm(allowedSubject, 'General');\n                setQuestionImage(null);\n                setQuestionImageUrl(asset.imageUrl);\n                setSubject(allowedSubject);\n                setDifficulty(asset.difficulty);\n                setQuestionType('multiple_choice');\n                setQuestionText(asset.title === 'Geometry diagram' ? '' : asset.title);\n              }}"""
          if old in text:
              text = text.replace(old, new, 1)
              portal.write_text(text, encoding='utf-8')
          elif "openMyPoolQuestionForm('Maths', asset.topic || 'Geometry')" in text:
              raise SystemExit('TeacherPortal geometry handler changed unexpectedly; refusing unsafe partial patch.')

          builder = Path('components/geometry/DiagramBuilder.tsx')
          text = builder.read_text(encoding='utf-8')
          replacements = [
              ("const [subject, setSubject] = useState('Maths');", "const [subject, setSubject] = useState('');"),
              ("setSubject('Maths');", "setSubject('');"),
              ("setSubject(question.subject);", "setSubject(question.subject || '');"),
              ("                  <span>{question.subject}</span>\n                  <span>•</span>", "                  <span>Reusable visual</span>\n                  <span>•</span>"),
              ("          subtitle: `${subject} · ${topic} · ${difficulty}`,", "          subtitle: `${topic} · ${difficulty}`,"),
              ("          subject,\n        },", "        },"),
          ]
          for old_value, new_value in replacements:
              text = text.replace(old_value, new_value)
          builder.write_text(text, encoding='utf-8')

      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/TeacherPortal.tsx components/geometry/DiagramBuilder.tsx
          git commit -m "Route geometry visuals through allocated question subjects"
          git push origin HEAD:fix/subject-neutral-geometry-assets
