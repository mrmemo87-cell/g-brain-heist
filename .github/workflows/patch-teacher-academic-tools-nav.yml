name: Patch teacher academic tools navigation

on:
  push:
    branches:
      - fix/teacher-academic-tools-nav

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/teacher-academic-tools-nav
          fetch-depth: 0

      - name: Verify teacher academic navigation and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path

          portal = Path('components/TeacherPortal.tsx').read_text(encoding='utf-8')
          required = [
              "label: 'Academic Profiles'",
              "label: 'Interventions'",
              "window.location.assign('/teacher-academic-profiles.html')",
              "window.location.assign('/teacher-interventions.html')",
          ]
          missing = [item for item in required if item not in portal]
          if missing:
              raise SystemExit(f'Missing expected teacher navigation changes: {missing}')

      - name: Self-clean one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-teacher-academic-tools-nav.yml
          git commit -m "Remove one-shot teacher academic navigation workflow"
          git push origin HEAD:fix/teacher-academic-tools-nav
