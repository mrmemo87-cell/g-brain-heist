name: Patch admin and School Head progress access

on:
  push:
    branches:
      - fix/admin-head-parent-progress-access

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-head-parent-progress-access
          fetch-depth: 0

      - name: Patch School Admin and School Head navigation
        shell: python
        run: |
          from pathlib import Path

          admin = Path('components/SchoolAdminPortal.tsx')
          text = admin.read_text(encoding='utf-8')
          original = text

          anchor = "const SCHOOL_ADMIN_PRIMARY_TAB_IDS = new Set<MainAdminTab>(['dashboard', 'members', 'classes', 'admissions']);\n"
          insert = anchor + "const SCHOOL_ADMIN_PROGRESS_TOOLS = [\n  { id: 'academic-profiles', icon: '🎓', label: 'Academic Profiles', description: 'Student progress, strengths and focus areas', href: '/teacher-academic-profiles.html' },\n  { id: 'interventions', icon: '🎯', label: 'Interventions', description: 'Targeted academic support and follow-up', href: '/teacher-interventions.html' },\n  { id: 'guardians', icon: '👨‍👩‍👧', label: 'Parents & Guardians', description: 'Invite, verify and manage parent access', href: '/guardian-management.html' },\n] as const;\n"
          if 'SCHOOL_ADMIN_PROGRESS_TOOLS' not in text:
              if anchor not in text: raise SystemExit('admin progress tools anchor missing')
              text = text.replace(anchor, insert, 1)

          sidebar_anchor = "      </nav>\n      <div className=\"school-admin-security-note\"><strong>Secure school record</strong><span>Changes are limited to authorised administrators.</span></div>\n"
          sidebar_insert = "        <div className=\"mt-4 border-t border-slate-700/70 pt-4\">\n          <p className=\"school-admin-nav-label\">Student progress</p>\n          {SCHOOL_ADMIN_PROGRESS_TOOLS.map((tool) => (\n            <button key={tool.id} type=\"button\" onClick={() => window.location.assign(tool.href)} data-testid={`school-admin-tool-${tool.id}`}>\n              {tool.label}\n            </button>\n          ))}\n        </div>\n      </nav>\n      <div className=\"school-admin-security-note\"><strong>Secure school record</strong><span>Changes are limited to authorised administrators.</span></div>\n"
          if 'data-testid={`school-admin-tool-${tool.id}`}' not in text:
              if sidebar_anchor not in text: raise SystemExit('admin sidebar anchor missing')
              text = text.replace(sidebar_anchor, sidebar_insert, 1)

          mobile_anchor = "              {visibleNavItems.map((tab) => (\n"
          if mobile_anchor not in text: raise SystemExit('admin mobile menu anchor missing')
          mobile_end = "              ))}\n            </div>\n"
          mobile_insert = "              ))}\n              {SCHOOL_ADMIN_PROGRESS_TOOLS.map((tool) => (\n                <button key={tool.id} type=\"button\" onClick={() => { setMobileAdminMenuOpen(false); window.location.assign(tool.href); }}>\n                  <span className=\"school-admin-mobile-menu-icon\" aria-hidden=\"true\">{tool.icon}</span>\n                  <span><strong>{tool.label}</strong><small>{tool.description}</small></span>\n                </button>\n              ))}\n            </div>\n"
          if 'Parents & Guardians' not in text[text.find(mobile_anchor):]:
              pos = text.find(mobile_anchor)
              end = text.find(mobile_end, pos)
              if end < 0: raise SystemExit('admin mobile end anchor missing')
              text = text[:end] + mobile_insert + text[end+len(mobile_end):]

          if text != original:
              admin.write_text(text, encoding='utf-8')

          head = Path('components/SchoolHeadPortal.tsx')
          htext = head.read_text(encoding='utf-8')
          horiginal = htext
          callout = "<section className=\"school-head-callout\"><div><p>Privacy-aware drill-down</p><h3>Need individual or class-level detail?</h3><span>Open controlled academic reports in the administration workspace. Sensitive access remains scoped and auditable.</span></div><button type=\"button\" onClick={() => openAdministration('cambridge')}>Open assessment reports</button></section>"
          replacement = "<section className=\"school-head-callout\"><div><p>Longitudinal learning intelligence</p><h3>See where progress is improving — and where support is still needed.</h3><span>Open the school-wide learning-memory view for subject, class and student intervention patterns. Persistent areas with stale evidence are flagged for reassessment rather than assumed to remain unresolved.</span></div><button type=\"button\" onClick={() => window.location.assign(`/school-head-learning-intelligence.html?school=${encodeURIComponent(schoolId)}`)}>Open learning intelligence</button></section>"
          if 'Open learning intelligence' not in htext:
              if callout not in htext: raise SystemExit('School Head academic callout anchor missing')
              htext = htext.replace(callout, replacement, 1)
          if htext != horiginal:
              head.write_text(htext, encoding='utf-8')

      - name: Commit navigation patch and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SchoolAdminPortal.tsx components/SchoolHeadPortal.tsx
          git rm .github/workflows/patch-admin-head-progress-access.yml
          git commit -m "Expose progress, parent access and learning intelligence" || exit 0
          git push origin HEAD:fix/admin-head-parent-progress-access
