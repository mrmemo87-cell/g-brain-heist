name: Apply School Head artwork fit

on:
  push:
    branches: [fix/school-head-program-art-fit]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-head-program-art-fit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply contained programme artwork styling
        shell: bash
        run: |
          if grep -q "School Head programme artwork fit" src/styles/school-head.css; then
            echo "Artwork fit override already exists"
            exit 1
          fi
          cat >> src/styles/school-head.css <<'EOF'

/* School Head programme artwork fit: preserve the full programme identity artwork. */
.school-head-program-grid article > img {
  display: block;
  width: calc(100% + 2.2rem) !important;
  height: clamp(6.5rem, 8vw, 7.25rem) !important;
  margin: -1.1rem -1.1rem .85rem !important;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--head-border);
  background: linear-gradient(180deg, #fbfdff 0%, #f4f8fb 100%);
  object-fit: contain !important;
  object-position: center !important;
}
.school-head-program-grid article > div:first-of-type {
  justify-content: flex-end;
}
.school-head-program-grid article > div:first-of-type > span {
  display: none;
}
EOF

      - run: npm ci
      - run: npm run build
      - run: git diff --check

      - name: Commit clean source patch
        shell: bash
        run: |
          rm .github/workflows/tmp-school-head-art-fit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/school-head.css .github/workflows/tmp-school-head-art-fit.yml
          git commit -m "Refine School Head programme artwork fit"
          git push origin HEAD:fix/school-head-program-art-fit
