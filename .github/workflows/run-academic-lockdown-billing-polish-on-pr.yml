name: Run academic lockdown billing polish on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/academic-lockdown-billing-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Correct guarded billing preflight typo
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/scripts/apply_academic_lockdown_billing_polish.py')
          source = path.read_text()
          old = r'\n          ))}'
          new = r'\n          )}'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one billing guard typo, found {count}')
          path.write_text(source.replace(old, new, 1))

      - name: Apply guarded patch
        run: python .github/scripts/apply_academic_lockdown_billing_polish.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary harness
        run: |
          rm .github/scripts/apply_academic_lockdown_billing_polish.py
          rm .github/workflows/apply-academic-lockdown-billing-polish.yml
          rm .github/workflows/run-academic-lockdown-billing-polish-on-pr.yml

      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish academic trends, mobile Lockdown and billing contrast"
          git push origin HEAD:${{ github.head_ref }}
