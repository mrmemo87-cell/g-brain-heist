name: Validate Academic Profile school-language refresh
on:
  push:
    branches:
      - fix/academic-profile-school-language
    paths-ignore:
      - validation/academic-profile-school-language.txt
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate branch
        id: validate
        shell: bash
        run: |
          set +e
          npm ci
          install_status=$?
          if [ "$install_status" -eq 0 ]; then npm run typecheck; typecheck_status=$?; else typecheck_status=99; fi
          if [ "$install_status" -eq 0 ]; then npm test; test_status=$?; else test_status=99; fi
          if [ "$install_status" -eq 0 ]; then npm run build; build_status=$?; else build_status=99; fi
          mkdir -p validation
          cat > validation/academic-profile-school-language.txt <<EOF
          source_commit=${GITHUB_SHA}
          install_status=${install_status}
          typecheck_status=${typecheck_status}
          test_status=${test_status}
          build_status=${build_status}
          EOF
          if [ "$install_status" -ne 0 ] || [ "$typecheck_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            echo "validation_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "validation_failed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit validation receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/academic-profile-school-language.txt
          git diff --cached --quiet || git commit -m "Record Academic Profile validation result"
          git push
      - name: Fail workflow when validation failed
        if: steps.validate.outputs.validation_failed == 'true'
        run: exit 1
