name: Temporary assignment PR patch validator
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch-assignment-pr:
    if: github.head_ref == 'agent/assignment-edit-publishing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/assignment-edit-publishing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 scripts/patch_assignment_edit_feature.py
      - run: python3 scripts/fix_assignment_patch_output.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated feature
        run: |
          rm -f .github/workflows/agent-assignment-edit-patch.yml scripts/patch_assignment_edit_feature.py scripts/fix_assignment_patch_output.py scripts/.assignment-edit-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add assignment editing and publication controls"
          git push
