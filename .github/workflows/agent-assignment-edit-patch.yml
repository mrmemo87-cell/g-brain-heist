# Trigger PR validation from the temporary main workflow.
name: Agent assignment edit patch
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.head_ref == 'agent/assignment-edit-publishing' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/assignment-edit-publishing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply feature patch
        run: python3 scripts/patch_assignment_edit_feature.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated feature
        run: |
          rm -f .github/workflows/agent-assignment-edit-patch.yml scripts/patch_assignment_edit_feature.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add assignment editing and publication controls"
          git push
