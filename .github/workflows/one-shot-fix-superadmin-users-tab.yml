name: One-shot fix Superadmin Users tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-superadmin-users-tab.yml'

permissions:
  contents: write

jobs:
  patch-users-tab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply surgical Users tab guard fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/admin/tabs/UsersTab.tsx')
          source = path.read_text()

          replacements = [
              (
                  "import React from 'react';\nimport { useAdmin } from '../AdminContext';",
                  "import React from 'react';\nimport type { Grade } from '../../../types';\nimport { useAdmin } from '../AdminContext';",
                  'Grade type import',
              ),
              (
                  "  } = useAdmin();\n\n  return (",
                  "  } = useAdmin();\n\n  // The admin context is intentionally loose-typed. Keep this tab fail-safe if a\n  // context value or RPC payload is temporarily missing/malformed instead of\n  // crashing the whole Superadmin portal and forcing a refresh.\n  const safeUsers = Array.isArray(users) ? users : [];\n  const safeGradeOptions = Array.isArray(gradeOptions) ? gradeOptions : [];\n  const safeBatchByGrade = batchByGrade && typeof batchByGrade === 'object' ? batchByGrade : {};\n\n  return (",
                  'safe context fallbacks',
              ),
              ("Showing {users.length} users", "Showing {safeUsers.length} users", 'header user count'),
              ("!usersLoading && users.length === 0", "!usersLoading && safeUsers.length === 0", 'empty state user count'),
              ("!usersLoading && users.map((user) => {", "!usersLoading && safeUsers.map((user) => {", 'safe users render'),
              (
                  "const availableBatches = userGrade ? batchByGrade[userGrade] : ['N/A'];",
                  "const availableBatches = userGrade ? (safeBatchByGrade[userGrade] ?? ['N/A']) : ['N/A'];",
                  'safe batch lookup',
              ),
              ("{gradeOptions.map((grade) => (", "{safeGradeOptions.map((grade) => (", 'safe grade options'),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source)

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify diff
        run: git diff --check

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix-superadmin-users-tab.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/admin/tabs/UsersTab.tsx .github/workflows/one-shot-fix-superadmin-users-tab.yml
          git commit -m "Fix Superadmin Users tab crash"
          git push origin HEAD:main
