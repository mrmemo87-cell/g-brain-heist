name: Temporary Neon Megacity V6 exact experience patcher

on:
  push:
    branches:
      - fix/neon-megacity-v6-exact-experience

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/neon-megacity-v6-exact-experience
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch student experience
        run: node scripts/tmp_patch_neon_v6_student.mjs
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/clanTerritory/components/ClanTerritoryStudentView.tsx
          git commit -m "fix: make City active flow the persistent V6 experience"
          git push origin HEAD:fix/neon-megacity-v6-exact-experience
