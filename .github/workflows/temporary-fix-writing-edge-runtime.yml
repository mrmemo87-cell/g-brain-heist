name: Temporary Writing Edge runtime hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-fix-writing-edge-runtime.yml

permissions:
  contents: write

jobs:
  patch-writing-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Writing AI request crash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/bh_writing_ai/index.ts')
          source = path.read_text()

          build_needle = '''const buildUserPrompt = (payload: Payload): string => {\n  const grade = normalizeGrade(payload.grade) ?? "unknown";\n  const genre = payload.genre?.trim() || "unknown";\n\n  if (payload.mode === "assessment_v2") {'''
          build_replacement = '''const buildUserPrompt = (payload: Payload): string => {\n  const grade = normalizeGrade(payload.grade) ?? "unknown";\n  const genre = payload.genre?.trim() || "unknown";\n  const trusted = payload.trustedTaskSnapshot;\n\n  if (payload.mode === "assessment_v2") {'''
          if build_needle not in source:
              raise SystemExit('buildUserPrompt patch target not found or already changed')
          source = source.replace(build_needle, build_replacement, 1)

          try_needle = '''  const userPrompt = buildUserPrompt(payload!);\n\n  try {\n    const pipelineStartedAt = Date.now();'''
          try_replacement = '''  try {\n    const userPrompt = buildUserPrompt(payload!);\n    const pipelineStartedAt = Date.now();'''
          if try_needle not in source:
              raise SystemExit('request try/catch patch target not found or already changed')
          source = source.replace(try_needle, try_replacement, 1)
          path.write_text(source)
          PY
      - name: Verify hotfix invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('supabase/functions/bh_writing_ai/index.ts').read_text()
          assert 'const trusted = payload.trustedTaskSnapshot;' in source
          assert 'try {\n    const userPrompt = buildUserPrompt(payload!);' in source
          assert 'const userPrompt = buildUserPrompt(payload!);\n\n  try {' not in source
          print('Writing Edge runtime hotfix verified')
          PY
      - name: Commit hotfix and remove temporary workflow
        run: |
          rm .github/workflows/temporary-fix-writing-edge-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Writing Hub Edge Function request crash"
          git push origin main
