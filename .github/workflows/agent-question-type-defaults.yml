name: Validate PDF question type defaults
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/pdf-default-question-types'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-default-question-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply default question type patch
        run: |
          if [ -f scripts/patch_pdf_default_question_types.py ]; then
            python3 scripts/patch_pdf_default_question_types.py
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated source
        run: |
          rm -f scripts/patch_pdf_default_question_types.py
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- dist-tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Default PDF generation to MCQ and true-false"
          git push
