<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brains Heist</title>
  <meta name="description" content="Brains Heist is a neon cyber-heist learning game where students become agents conquering quests, PvP hacks, and leaderboards." />
    <!-- Installable web app: home-screen icon and standalone display on iOS and Android. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050813" />
    <meta name="application-name" content="Brains Heist" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Brains Heist" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
  <body>
    <div id="root"></div>
    <script>
      document.addEventListener('click', (event) => {
        const trigger = event.target instanceof Element
          ? event.target.closest('button, a')
          : null;

        if (!trigger || !trigger.textContent?.includes('Get started free')) return;

        event.preventDefault();

        const signUpTab = Array.from(document.querySelectorAll('[role="tab"]')).find(
          (tab) => tab.textContent?.trim() === 'Sign up'
        );

        if (signUpTab instanceof HTMLElement) {
          signUpTab.click();
        }

        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(() => {
            const emailField = document.getElementById('email');
            if (!(emailField instanceof HTMLElement)) return;

            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            emailField.scrollIntoView({
              behavior: reduceMotion ? 'auto' : 'smooth',
              block: 'center',
            });

            window.setTimeout(() => emailField.focus({ preventScroll: true }), reduceMotion ? 0 : 450);
          });
        });
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
