<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brains Heist</title>
    <meta name="description" content="Brains Heist is a neon cyber-heist learning game where students become agents conquering quests, PvP hacks, and leaderboards." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --plasma-pink: #ff2d91;
        --ion-blue: #00d0e8;
        --success-teal: #16e2a1;
        --amber-warn: #ffb020;
        --danger-red: #ff3b81;
        --grid-purple: #9e5dff;
        --ink-900: #0d1117;
        --ink-800: #161b22;
        --mist-400: #9ba3af;
        --paper-50: #f6f7fb;
      }

      body {
        font-family: 'IBM Plex Sans', sans-serif;
        background-color: var(--ink-900);
        background-image: 
          radial-gradient(circle at 25px 25px, rgba(0, 208, 232, 0.2) 2%, transparent 0%), 
          radial-gradient(circle at 75px 75px, rgba(255, 45, 145, 0.2) 2%, transparent 0%);
        background-size: 100px 100px;
        color: var(--paper-50);
      }
      
      .font-heading {
        font-family: 'IBM Plex Sans', sans-serif;
        font-weight: 700;
      }
      
      .card-glass {
        background: rgba(22, 27, 34, 0.7);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-width: 1px;
        border-color: rgba(155, 163, 175, 0.2);
        border-radius: 24px;
      }

      .glow-ion {
        box-shadow: 0 0 15px rgba(0, 208, 232, 0.2);
      }
      
      .glow-plasma {
        box-shadow: 0 0 15px rgba(255, 45, 145, 0.2);
      }
      
      .glow-success {
        box-shadow: 0 0 15px rgba(22, 226, 161, 0.25);
      }
      
      .glow-warn {
        box-shadow: 0 0 15px rgba(255, 176, 32, 0.25);
      }

      .glow-purple {
        box-shadow: 0 0 15px rgba(158, 93, 255, 0.25);
      }

      .progress-bar-glow-ion {
        filter: drop-shadow(0 0 4px var(--ion-blue));
      }
      
      .progress-bar-glow-warn {
        filter: drop-shadow(0 0 4px var(--amber-warn));
      }

      .progress-bar-glow-plasma {
        filter: drop-shadow(0 0 4px var(--plasma-pink));
      }
      
      @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.5); }
        100% { transform: scale(1); }
      }
      .animate-pop {
        animation: pop 0.3s ease-out forwards;
        display: inline-block;
      }

      /* Cool Modern Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse-glow {
        0%, 100% { 
          box-shadow: 0 0 20px rgba(0, 208, 232, 0.4), 0 0 40px rgba(255, 45, 145, 0.2);
        }
        50% { 
          box-shadow: 0 0 30px rgba(0, 208, 232, 0.6), 0 0 60px rgba(255, 45, 145, 0.4);
        }
      }

      @keyframes slide-in-right {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes slide-in-left {
        from {
          transform: translateX(-100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes fade-in-up {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -1000px 0;
        }
        100% {
          background-position: 1000px 0;
        }
      }

      @keyframes neon-pulse {
        0%, 100% {
          text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor;
        }
        50% {
          text-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor;
        }
      }

      .animate-float {
        animation: float 3s ease-in-out infinite;
      }

      .animate-pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }

      .animate-slide-in-right {
        animation: slide-in-right 0.5s ease-out forwards;
      }

      .animate-slide-in-left {
        animation: slide-in-left 0.5s ease-out forwards;
      }

      .animate-fade-in-up {
        animation: fade-in-up 0.6s ease-out forwards;
      }

      .shimmer-effect {
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        background-size: 1000px 100%;
        animation: shimmer 2s infinite;
      }

      .neon-text {
        animation: neon-pulse 2s ease-in-out infinite;
      }

      /* Enhanced card hover effects */
      .card-glass:hover {
        transform: translateY(-2px);
        border-color: rgba(0, 208, 232, 0.4);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Button hover effects */
      button:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.2);
        transition: all 0.2s ease;
      }

      button:active:not(:disabled) {
        transform: translateY(0) scale(0.98);
      }

      /* Gradient backgrounds for action buttons */
      .gradient-cyan {
        background: linear-gradient(135deg, #00d0e8 0%, #0099ff 100%);
      }

      .gradient-pink {
        background: linear-gradient(135deg, #ff2d91 0%, #ff6b9d 100%);
      }

      .gradient-purple {
        background: linear-gradient(135deg, #9e5dff 0%, #7c3aed 100%);
      }

      .gradient-gold {
        background: linear-gradient(135deg, #ffb020 0%, #ffd700 100%);
      }

      /* Particle effect background */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
          radial-gradient(circle at 20% 50%, rgba(0, 208, 232, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 50%, rgba(255, 45, 145, 0.1) 0%, transparent 50%);
        animation: float 8s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      #root {
        position: relative;
        z-index: 1;
      }

      /* Mobile Touch Target Optimization */
      @media (max-width: 768px) {
        /* Ensure all interactive elements have 44px minimum touch target */
        button, a, [role="button"], [tabindex="0"] {
          min-height: 44px;
          min-width: 44px;
        }

        /* Increase padding on cards for better spacing */
        .card-glass {
          padding: 1rem;
        }

        /* Make stat chips more touchable */
        .stat-chip {
          padding: 0.75rem 1rem;
          min-height: 44px;
        }

        /* Better spacing for mobile grid */
        .grid {
          gap: 1rem;
        }

        /* Increase action button padding */
        .action-btn {
          padding: 1rem;
          min-height: 56px;
        }

        /* Better touch targets for form inputs */
        input, select, textarea {
          min-height: 44px;
          padding: 0.75rem;
          font-size: 16px; /* Prevents zoom on iOS */
        }

        /* Improve modal touch targets */
        .modal-button {
          min-height: 48px;
          padding: 0.75rem 1.5rem;
        }
      }

      /* Larger touch targets for all screens */
      button {
        min-height: 40px;
        padding: 0.5rem 1rem;
      }

    </style>

{

</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
