    <path d="M-153 154-115 126h230l38 28-33 15H-120Z" fill="#0b1c31" stroke="#38bdf8" stroke-opacity="0.28"/>
    <path d="M-78 117-42 84h84l36 33-19 31H-59Z" fill="#102844" stroke="#4cb5dc" stroke-opacity="0.34"/>

    <path d="M-32 92-17-58H17L32 92l-16 34h-32Z" fill="url(#tower)" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M-7 84-2-102H2L7 84Z" fill="url(#spire)" filter="url(#glow)"/>
    <path d="M-18 70-11-12H11l7 82-10 27H-8Z" fill="#09203a" stroke="#67e8f9" stroke-opacity="0.45"/>
    <path d="M0-96V74" stroke="#a5f3fc" stroke-opacity="0.9" stroke-width="2.2" filter="url(#glow)"/>

    <circle cx="0" cy="78" r="48" fill="url(#core)" opacity="0.5" filter="url(#glow)"/>
