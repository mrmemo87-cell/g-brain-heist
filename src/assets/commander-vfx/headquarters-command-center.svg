<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Futuristic Commander headquarters</title>
  <desc id="desc">A neon command citadel rising over a cybernetic city at dusk.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07142b"/>
      <stop offset="0.5" stop-color="#0b2240"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132b4b"/>
      <stop offset="0.52" stop-color="#09162b"/>
      <stop offset="1" stop-color="#050a15"/>
    </linearGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.33" stop-color="#0ea5e9"/>
      <stop offset="0.72" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.2" stop-color="#67e8f9" stop-opacity="0.96"/>
      <stop offset="0.55" stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" fill="none" stroke="#67e8f9" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>
  <rect width="1600" height="520" fill="url(#grid)" opacity="0.5"/>
  <ellipse cx="1050" cy="240" rx="500" ry="150" fill="#0ea5e9" opacity="0.08" filter="url(#soft)"/>
  <ellipse cx="1280" cy="270" rx="300" ry="120" fill="#7c3aed" opacity="0.07" filter="url(#soft)"/>

  <g opacity="0.72">
