<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Brain Heist Neon Megacity Territory Map</title>
  <desc id="desc">A futuristic ten-district cyber city battlefield for Clan Territory Wars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".5" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>
    <radialGradient id="coreHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset=".55" stop-color="#8b5cf6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21364e"/>
      <stop offset="1" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28435d"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#233247"/>
      <stop offset=".5" stop-color="#394d66"/>
      <stop offset="1" stop-color="#233247"/>
    </linearGradient>
    <pattern id="microgrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#6ea6ca" stroke-opacity=".07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#67e8f9" fill-opacity=".10"/>
    </pattern>
    <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="cityClip">
      <path d="M90 90H1510V810H90Z"/>
    </clipPath>
    <style>
      .territory-surface { fill:#1f2937; stroke:#475569; stroke-width:3; vector-effect:non-scaling-stroke; transition:opacity .22s ease; }
      .district-label { font-family:Inter,ui-sans-serif,system-ui,sans-serif; font-weight:900; letter-spacing:1.4px; fill:#f8fafc; stroke:none; filter:url(#glowSoft); }
      .district-sub { font-family:Inter,ui-sans-serif,system-ui,sans-serif; font-size:13px; font-weight:800; letter-spacing:3px; fill:#94a3b8; }
      .micro { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; fill:#67e8f9; letter-spacing:1.8px; opacity:.82; }
      .window { fill:#67e8f9; opacity:.42; }
      .window.hot { fill:#f59e0b; opacity:.65; }
      .neonline { fill:none; stroke:#22d3ee; stroke-width:2; opacity:.68; filter:url(#glowSoft); }
      .purpleline { fill:none; stroke:#a78bfa; stroke-width:2; opacity:.58; filter:url(#glowSoft); }
      .traffic { fill:none; stroke:#67e8f9; stroke-width:2; stroke-linecap:round; stroke-dasharray:3 15; opacity:.75; animation:traffic 2.7s linear infinite; }
      .traffic.alt { stroke:#f59e0b; animation-duration:3.5s; animation-direction:reverse; }
      .scan { opacity:.18; animation:scan 7s ease-in-out infinite; }
      .reactor { transform-origin:810px 455px; animation:reactor 4s ease-in-out infinite; }
      .holo { animation:holo 3.4s steps(1,end) infinite; }
      .beacon { animation:beacon 2.1s ease-in-out infinite; }
      @keyframes traffic { to { stroke-dashoffset:-72; } }
      @keyframes scan { 0%,100% { transform:translateY(-90px); opacity:.02; } 45%,55% { opacity:.22; } 50% { transform:translateY(820px); } }
      @keyframes reactor { 0%,100% { opacity:.7; transform:scale(.96); } 50% { opacity:1; transform:scale(1.045); } }
      @keyframes holo { 0%,92%,100% { opacity:.78; } 94% { opacity:.35; } 96% { opacity:1; } }
      @keyframes beacon { 0%,100% { opacity:.3; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) {
        .traffic,.scan,.reactor,.holo,.beacon { animation:none !important; }
      }
    </style>
  </defs>

