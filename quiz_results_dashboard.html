    </div>

    </div>
    <div class="stat-card">
      <h3>Lowest Score</h3>
      <div class="value" id="lowestScore">-</div>
    </div>
  </div>

  <div class="filters">
    <label>Class:</label>
    <select id="classFilter">
      <option value="">All Classes</option>
    </select>
    
    <label>Sort by:</label>
    <select id="sortBy">
      <option value="submitted_at">Date (Newest)</option>
      <option value="submitted_at_asc">Date (Oldest)</option>
      <option value="percentage_desc">Score (Highest)</option>
      <option value="percentage_asc">Score (Lowest)</option>
      <option value="student_name">Name (A-Z)</option>
      <option value="time_taken">Time (Fastest)</option>
    </select>
    
    <button onclick="loadResults()" class="refresh-btn">🔄 Refresh</button>
    <button onclick="exportCSV()" class="export-btn">📥 Export CSV</button>
    <button onclick="window.print()" class="print-btn">🖨️ Print</button>
  </div>

  <div class="results-table">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Student Name</th>
          <th>Class</th>
          <th>Score</th>
          <th>Time</th>
          <th>Submitted</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="resultsBody">
        <tr>
          <td colspan="7" class="loading">Loading results...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">

    </div>
    <div class="modal-body" id="modalBody">
      <!-- Content loaded dynamically -->
    </div>

</div>

  // Improvement tips based on skills
  const skillTips = {
    "Vocabulary": {
      tips: [
        "Read more English texts daily (news articles, short stories)",

    },
    "Detailed Comprehension": {
      tips: [

        "Watch for words like 'however', 'although', 'despite' that signal contrasts",
        "Be careful with 'all', 'never', 'always' - these are often wrong",
        "The answer is IN the text - don't use outside knowledge",

      ],
      resources: "Practice reading academic texts and answering detailed questions"
    }
  };

  let allResults = [];

  // Load results on page load
  document.addEventListener('DOMContentLoaded', loadResults);

  async function loadResults() {
    const tbody = document.getElementById('resultsBody');
    tbody.innerHTML = '<tr><td colspan="7" class="loading">Loading...</td></tr>';

    try {
      const { data, error } = await supabaseClient
        .from('quiz_scores')
        .select('*')
        .eq('quiz_name', 'Cambridge Reading 25')
        .order('submitted_at', { ascending: false });

      if (error) throw error;

      allResults = data || [];
      
      // Update stats
      updateStats(allResults);
      
      // Populate class filter
      populateClassFilter(allResults);
      
      // Display results
      displayResults(allResults);

    } catch (error) {
      console.error('Error loading results:', error);
      tbody.innerHTML = `<tr><td colspan="7" class="no-data">❌ Error loading results: ${error.message}</td></tr>`;
    }
  }

  function updateStats(results) {
    document.getElementById('totalSubmissions').textContent = results.length;
    
    if (results.length > 0) {
      const avg = results.reduce((sum, r) => sum + r.percentage, 0) / results.length;
      const highest = Math.max(...results.map(r => r.percentage));
      const lowest = Math.min(...results.map(r => r.percentage));
      
      document.getElementById('avgScore').textContent = avg.toFixed(1) + '%';
      document.getElementById('highestScore').textContent = highest + '%';
      document.getElementById('lowestScore').textContent = lowest + '%';
    } else {
      document.getElementById('avgScore').textContent = '-';
      document.getElementById('highestScore').textContent = '-';
      document.getElementById('lowestScore').textContent = '-';
    }
  }

  function populateClassFilter(results) {
    const classFilter = document.getElementById('classFilter');
    const classes = [...new Set(results.map(r => r.student_class).filter(c => c))];
    
    // Keep first option
    classFilter.innerHTML = '<option value="">All Classes</option>';
    classes.sort().forEach(c => {
      classFilter.innerHTML += `<option value="${c}">${c}</option>`;
    });
  }

  function displayResults(results) {
    const tbody = document.getElementById('resultsBody');
    const classFilter = document.getElementById('classFilter').value;
    const sortBy = document.getElementById('sortBy').value;

    // Filter by class
    let filtered = classFilter 
      ? results.filter(r => r.student_class === classFilter)
      : results;

    // Sort
    filtered = sortResults(filtered, sortBy);

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="no-data">No submissions found</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map((r, index) => `
      <tr>
        <td>${index + 1}</td>
        <td><strong>${escapeHtml(r.student_name)}</strong></td>
        <td>${escapeHtml(r.student_class || '-')}</td>
        <td>
          <span class="score-badge ${getScoreClass(r.percentage)}">
            ${r.score}/${r.total_questions} (${r.percentage}%)
          </span>
        </td>
        <td>${formatTime(r.time_taken_seconds)}</td>
        <td>${formatDate(r.submitted_at)}</td>
        <td>
          <button class="view-btn" onclick='viewDetails(${JSON.stringify(r).replace(/'/g, "\\'")})'>
            👁️ View
          </button>
        </td>
      </tr>
    `).join('');
  }

  function sortResults(results, sortBy) {
    const sorted = [...results];
    switch(sortBy) {
      case 'submitted_at':
        return sorted.sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
      case 'submitted_at_asc':
        return sorted.sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at));
      case 'percentage_desc':
        return sorted.sort((a, b) => b.percentage - a.percentage);
      case 'percentage_asc':
        return sorted.sort((a, b) => a.percentage - b.percentage);
      case 'student_name':
        return sorted.sort((a, b) => a.student_name.localeCompare(b.student_name));
      case 'time_taken':
        return sorted.sort((a, b) => (a.time_taken_seconds || 9999) - (b.time_taken_seconds || 9999));
      default:
        return sorted;
    }
  }

  function getScoreClass(percentage) {
    if (percentage >= 90) return 'score-excellent';
    if (percentage >= 70) return 'score-good';
    if (percentage >= 50) return 'score-average';
    return 'score-poor';
  }

  function formatTime(seconds) {
    if (!seconds) return '-';
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}m ${secs}s`;
  }

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-GB', {
      day: '2-digit',
      month: 'short',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function viewDetails(result) {
    const modal = document.getElementById('modalOverlay');
    const body = document.getElementById('modalBody');
    
    const answers = result.answers || {};
    let correctCount = 0;
    let incorrectCount = 0;
    
    // Track mistakes by skill
    const skillPerformance = {};
    const mistakesBySkill = {};
    
    // Initialize skill tracking
    Object.values(questionSkills).forEach(q => {
      if (!skillPerformance[q.skill]) {
        skillPerformance[q.skill] = { correct: 0, total: 0 };
        mistakesBySkill[q.skill] = [];
      }
    });
    
    // Build answers grid and analyze performance
    let answersHtml = '';
    for (let i = 1; i <= 42; i++) {
      const studentAns = (answers[i] || '').trim();
      const correctAns = correct[i];
      const isCorrect = studentAns.toLowerCase() === correctAns.toLowerCase();
      const skill = questionSkills[i].skill;
      
      skillPerformance[skill].total++;
      
      if (isCorrect) {
        correctCount++;
        skillPerformance[skill].correct++;
      } else {
        incorrectCount++;
        mistakesBySkill[skill].push({
          question: i,
          studentAnswer: studentAns || '(blank)',
          correctAnswer: correctAns
        });
      }
      
      answersHtml += `
        <div class="answer-item ${isCorrect ? 'answer-correct' : 'answer-incorrect'}">
          <div class="q-num">Q${i}</div>
          <div class="student-ans">${escapeHtml(studentAns) || '<em>blank</em>'}</div>
          ${!isCorrect ? `<div class="correct-ans">✓ ${correctAns}</div>` : ''}
        </div>
      `;
    }
    
    // Calculate skill percentages and generate analysis
    const skillAnalysis = Object.entries(skillPerformance).map(([skill, data]) => ({
      skill,
      correct: data.correct,
      total: data.total,
      percentage: Math.round((data.correct / data.total) * 100),
      mistakes: mistakesBySkill[skill]
    })).sort((a, b) => a.percentage - b.percentage); // Sort by worst first
    
    // Generate skill bars HTML
    const skillBarsHtml = skillAnalysis.map(s => {
      const barClass = s.percentage >= 90 ? 'skill-excellent' : 
                       s.percentage >= 70 ? 'skill-good' : 
                       s.percentage >= 50 ? 'skill-average' : 'skill-poor';
      return `
        <div class="skill-bar-container">
          <div class="skill-label">
            <span>${s.skill}</span>
            <span>${s.correct}/${s.total} (${s.percentage}%)</span>
          </div>
          <div class="skill-bar">
            <div class="skill-bar-fill ${barClass}" style="width: ${s.percentage}%"></div>
          </div>
        </div>
      `;
    }).join('');
    
    // Generate improvement tips for weak areas
    const weakAreas = skillAnalysis.filter(s => s.percentage < 80);
    let tipsHtml = '';
    
    if (weakAreas.length > 0) {
      tipsHtml = weakAreas.map(area => {
        const tips = skillTips[area.skill];
        const priority = area.percentage < 50 ? 'high' : area.percentage < 70 ? 'medium' : 'low';
        const mistakesList = area.mistakes.slice(0, 3).map(m => 
          `Q${m.question}: wrote "${m.studentAnswer}" → correct: "${m.correctAnswer}"`
        ).join(', ');
        
        return `
          <div class="tip-card priority-${priority}">
            <h4>📌 ${area.skill} (${area.percentage}%)</h4>
            <p><strong>Tips to improve:</strong></p>
            <ul style="margin: 8px 0; padding-left: 20px; font-size: 13px; color: #555;">
              ${tips.tips.slice(0, 3).map(t => `<li>${t}</li>`).join('')}
            </ul>
            <p style="font-size: 12px; color: #17a2b8;"><strong>📚 Resource:</strong> ${tips.resources}</p>
            ${area.mistakes.length > 0 ? `<div class="mistakes"><strong>Mistakes:</strong> ${mistakesList}</div>` : ''}
          </div>
        `;
      }).join('');
    } else {
      tipsHtml = `
        <div class="tip-card priority-low">
          <h4>🌟 Excellent Performance!</h4>
          <p>All skills are above 80%. Keep up the great work! To maintain this level:</p>
          <ul style="margin: 8px 0; padding-left: 20px; font-size: 13px; color: #555;">
            <li>Continue practicing with timed tests</li>
            <li>Challenge yourself with harder texts</li>
            <li>Help classmates who are struggling</li>
          </ul>
        </div>
      `;
    }
    
    // Calculate letter grade
    const grade = result.percentage >= 90 ? 'A' : 
                  result.percentage >= 80 ? 'B' : 
                  result.percentage >= 70 ? 'C' : 
                  result.percentage >= 60 ? 'D' : 'F';
    
    // Encouragement message based on performance
    const encouragementMessages = {
      'A': { emoji: '🏆', title: 'Outstanding!', message: 'You have excellent reading skills. Keep challenging yourself with advanced materials!' },
      'B': { emoji: '⭐', title: 'Great Job!', message: 'You\'re performing well. Focus on the few areas below to reach the top!' },
      'C': { emoji: '👍', title: 'Good Effort!', message: 'You\'re on the right track. With focused practice on weak areas, you\'ll improve quickly!' },
      'D': { emoji: '💪', title: 'Keep Going!', message: 'Don\'t give up! Focus on the tips below and practice regularly. You can do this!' },
      'F': { emoji: '📚', title: 'Time to Focus', message: 'This quiz shows areas that need work. Follow the tips below and ask your teacher for help. Improvement is possible!' }
    };
    const encouragement = encouragementMessages[grade];

    body.innerHTML = `
      <div class="student-info-card">
        <div class="info-item">
          <label>Student Name</label>
          <div class="value">${escapeHtml(result.student_name)}</div>
        </div>
        <div class="info-item">
          <label>Class</label>
          <div class="value">${escapeHtml(result.student_class || '-')}</div>
        </div>
        <div class="info-item">
          <label>Score</label>
          <div class="value">${result.score} / ${result.total_questions}</div>
        </div>
        <div class="info-item">
          <label>Percentage</label>
          <div class="value">${result.percentage}%</div>
        </div>
        <div class="info-item">
          <label>Grade</label>
          <div class="value"><span class="grade-badge grade-${grade}">${grade}</span></div>
        </div>
        <div class="info-item">
          <label>Time Taken</label>
          <div class="value">${formatTime(result.time_taken_seconds)}</div>
        </div>
      </div>

      <div class="encouragement">
        <h3>${encouragement.emoji} ${encouragement.title}</h3>
        <p>${encouragement.message}</p>
      </div>

      <div class="report-section">
        <h3>📊 Skills Analysis</h3>
        ${skillBarsHtml}
      </div>

      <div class="report-section">
        <h3>💡 Personalized Improvement Tips</h3>
        ${tipsHtml}
      </div>

      <div class="report-section">
        <h3>📝 Answer Details</h3>
        <p style="margin-bottom: 15px; color: #666;">
          <span style="color: #28a745;">✓ ${correctCount} Correct</span> &nbsp;|&nbsp; 
          <span style="color: #dc3545;">✗ ${incorrectCount} Incorrect</span>
        </p>
        <div class="answers-grid">
          ${answersHtml}
        </div>
      </div>

      <div style="text-align: center;">
        <button class="print-report-btn" onclick="printReport()">🖨️ Print This Report</button>
      </div>
    `;

    modal.classList.add('show');
  }

  function printReport() {
    window.print();
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  // Close modal on overlay click
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Close modal on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  // Filter change handlers
  document.getElementById('classFilter').addEventListener('change', () => displayResults(allResults));
  document.getElementById('sortBy').addEventListener('change', () => displayResults(allResults));

  // Export to CSV
  function exportCSV() {
    if (allResults.length === 0) {
      alert('No data to export');
      return;
    }

    const headers = ['Name', 'Class', 'Score', 'Total', 'Percentage', 'Time (seconds)', 'Submitted'];
    const rows = allResults.map(r => [
      r.student_name,
      r.student_class || '',
      r.score,
      r.total_questions,
      r.percentage,
      r.time_taken_seconds || '',
      r.submitted_at
    ]);

    // Add question answers
    for (let i = 1; i <= 42; i++) {
      headers.push(`Q${i}`);
    }
    rows.forEach((row, idx) => {
      const answers = allResults[idx].answers || {};
      for (let i = 1; i <= 42; i++) {
        row.push(answers[i] || '');
      }
    });

    const csv = [headers.join(','), ...rows.map(r => r.map(cell => `"${cell}"`).join(','))].join('\n');
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `quiz_results_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
