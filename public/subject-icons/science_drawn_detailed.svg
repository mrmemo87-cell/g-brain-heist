<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Science subject icon — detailed drawn</title>
  <desc id="desc">A clean animated SVG for Science showing a microscope, a small flask, and discovery spark details, all drawn in sequence.</desc>
  <defs>
    <linearGradient id="blueGrad" x1="52" y1="40" x2="180" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4EE4FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="160" y1="54" x2="212" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFFF55"/>
      <stop offset="100%" stop-color="#14B86E"/>
    </linearGradient>
    <style>
      .draw {
        fill:none;
        stroke-linecap:round;
        stroke-linejoin:round;
        stroke-dasharray:320;
        stroke-dashoffset:320;
      }
      .main { stroke:url(#blueGrad); stroke-width:10; animation: drawMain 3.3s ease-in-out infinite; }
      .accent { stroke:url(#greenGrad); stroke-width:7; animation: drawAccent 3.3s ease-in-out infinite; }
      .thin { stroke:#E8F7FF; stroke-width:4; animation: drawThin 3.3s ease-in-out infinite; }
      .detail1 { animation-delay:.35s; }
      .detail2 { animation-delay:.55s; }
      .detail3 { animation-delay:.75s; }
      .detail4 { animation-delay:.95s; }
      .detail5 { animation-delay:1.15s; }

      @keyframes drawMain {
        0% { stroke-dashoffset:320; opacity:1; }
        34% { stroke-dashoffset:0; opacity:1; }
        82% { stroke-dashoffset:0; opacity:1; }
        100% { stroke-dashoffset:-320; opacity:0; }
      }
      @keyframes drawAccent {
        0%,16% { stroke-dashoffset:320; opacity:0; }
        32% { opacity:1; }
        50%,82% { stroke-dashoffset:0; opacity:1; }
        100% { stroke-dashoffset:-320; opacity:0; }
      }
      @keyframes drawThin {
        0%,22% { stroke-dashoffset:320; opacity:0; }
        36% { opacity:1; }
        54%,82% { stroke-dashoffset:0; opacity:1; }
        100% { stroke-dashoffset:-320; opacity:0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .draw { animation:none !important; stroke-dashoffset:0 !important; opacity:1 !important; }
      }
    </style>
  </defs>

  <!-- Microscope body -->
  <path class="draw main" d="M92 46 L116 70 L101 85 L78 62 Z"/>
  <path class="draw main detail1" d="M102 84 C 118 95, 125 110, 123 126 C 121 145, 107 160, 90 166"/>
  <path class="draw main detail2" d="M87 165 C 76 178, 75 193, 83 205"/>
  <path class="draw main detail2" d="M66 205 H142"/>
  <path class="draw main detail3" d="M108 118 H154"/>
  <path class="draw main detail3" d="M145 118 V138"/>
  <path class="draw main detail4" d="M132 138 H158"/>
  <path class="draw main detail4" d="M80 205 C 98 214, 124 214, 143 205"/>

  <!-- Objective / lens -->
  <path class="draw thin detail2" d="M92 72 L82 84"/>
  <path class="draw thin detail3" d="M84 86 L94 96"/>

  <!-- Small flask to make it broader Science, not only microscopy -->
  <path class="draw accent detail3" d="M184 82 V112 L166 146 C 160 157, 168 170, 181 170 H207 C 220 170, 228 157, 222 146 L204 112 V82"/>
  <path class="draw accent detail4" d="M180 82 H208"/>
  <path class="draw thin detail4" d="M171 149 C 184 143, 202 143, 217 149"/>

  <!-- Simple discovery marks -->
  <path class="draw thin detail5" d="M182 42 V54"/>
  <path class="draw thin detail5" d="M176 48 H188"/>
  <path class="draw thin detail5" d="M212 54 V64"/>
  <path class="draw thin detail5" d="M207 59 H217"/>
</svg>